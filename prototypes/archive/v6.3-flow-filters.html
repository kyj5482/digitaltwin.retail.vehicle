<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기아 북미권역 월드 트윈 — V6 · 업무 디지털 트윈</title>
<style>
/* ─── 테마 토큰 (dataviz 레퍼런스 팔레트) — 다크 기본 ─── */
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --panel:#201f1e;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --base:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --delta-good:#0ca30c; --delta-bad:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --land:#232522; --land-line:#3b3e38; --water-grid:#20221f;
}
:root[data-theme=light]{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --panel:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6;
  --delta-good:#006300; --delta-bad:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --land:#edebe2; --land-line:#cfccbf; --water-grid:#efeee8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink);
  display:grid; grid-template-rows:auto auto 1fr auto; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{
  display:flex;align-items:center;gap:14px;padding:8px 16px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
header h1{font-size:15px;font-weight:600;white-space:nowrap}
header .sub{color:var(--muted);font-size:12px;white-space:nowrap}
#crumbs{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0;flex-wrap:wrap}
#crumbs .crumb{padding:3px 8px;border-radius:6px;white-space:nowrap}
#crumbs .crumb.link{color:var(--accent);cursor:pointer}
#crumbs .crumb.link:hover{background:var(--border)}
#crumbs .sep{color:var(--muted)}
header .grow{flex:1}
#modeBadge{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);white-space:nowrap}
#modeBadge.sim{color:var(--serious);border-color:var(--serious)}
#themeBtn,#backBtn{padding:4px 10px;border:1px solid var(--border);border-radius:7px;color:var(--ink2);font-size:12px;white-space:nowrap}
#themeBtn:hover,#backBtn:hover{background:var(--border)}
#backBtn[hidden]{display:none}

#alerts{
  display:flex;gap:8px;align-items:center;padding:5px 16px;min-height:34px;
  background:var(--page);overflow-x:auto;scrollbar-width:none;
}
#alerts::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  padding:3px 10px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink2);white-space:nowrap;
}
.chip .ic{font-size:12px}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.chip.serious{border-color:color-mix(in srgb,var(--serious) 60%,transparent)}
.chip.crit{border-color:color-mix(in srgb,var(--crit) 60%,transparent)}
.chip.good{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.chip b{color:var(--ink);font-weight:600}

#sceneWrap{position:relative;overflow:hidden;background:var(--page)}
#scene{width:100%;height:100%;display:block;touch-action:none}
#scene.panning{cursor:grabbing}
#scene.pannable{cursor:grab}

.land{fill:var(--land);stroke:var(--land-line);stroke-width:1;vector-effect:non-scaling-stroke}
.lake{fill:var(--page);stroke:var(--land-line);stroke-width:.7;vector-effect:non-scaling-stroke}
.graticule{stroke:var(--water-grid);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
.country-label{fill:var(--muted);letter-spacing:.25em;opacity:.75}
.geo-label{fill:var(--muted);font-size:9px}

.route{fill:none;stroke:var(--base);vector-effect:non-scaling-stroke}
.route.logi{stroke-width:2.5;opacity:.9}
.route.data{stroke-width:1.2;stroke-dasharray:5 4;opacity:.8}
.route.thin{stroke-width:1.4;opacity:.55}
.routeHit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.particle-logi{fill:var(--accent)}
.particle-data{fill:var(--s3)}

/* ─── 엔티티 (LOD 카드 — 화면 픽셀 고정 크기) ─── */
.entity{cursor:pointer}
.entity .box{fill:var(--surface);stroke:var(--border)}
.entity:hover .box{stroke:var(--accent)}
.entity .box.prodco{stroke-dasharray:none;stroke:color-mix(in srgb,var(--ink2) 40%,transparent)}
.entity:hover .box.prodco{stroke:var(--accent)}
.entity .name{fill:var(--ink);font-weight:600}
.entity .meta{fill:var(--ink2)}
.entity .tiny{fill:var(--muted)}
.entity .hint{fill:var(--accent)}
.entity .pin{fill:var(--accent);stroke:var(--page);stroke-width:1.4}
.entity .pin.prod{fill:var(--ink2)}
.entity .pin.zone{fill:var(--muted)}
.leader{stroke:var(--muted);stroke-width:1;fill:none;opacity:.7}
.anchor-dot{fill:var(--muted)}
.cluster .cbox{fill:var(--surface);stroke:var(--accent)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.lamp-label{font-size:9px;fill:var(--ink2)}
.stopped-hatch{fill:url(#hatch);opacity:.65}
.flow-badge rect{fill:var(--surface);stroke:var(--border)}
.flow-badge text{fill:var(--ink2);font-size:10px}
.batchMarker rect{fill:var(--surface);stroke:var(--accent)}
.batchMarker text{fill:var(--ink);font-size:9.5px;font-weight:600}

#zoomCtl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
#zoomCtl button{
  width:30px;height:30px;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--ink2);font-size:15px;line-height:1;
}
#zoomCtl button:hover{border-color:var(--accent);color:var(--ink)}
#zoomHint{position:absolute;top:12px;right:52px;font-size:11px;color:var(--muted);z-index:5;text-align:right}
#lodBadge{position:absolute;top:76px;right:52px;font-size:10.5px;color:var(--muted);z-index:5;text-align:right}

/* ─── 흐름 레이어 · 차종 필터 칩 바 (미국 뷰 전용) ─── */
#flowBar{
  position:absolute;top:12px;left:12px;z-index:5;
  display:flex;flex-direction:column;gap:6px;max-width:640px;
}
#flowBar .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#flowBar .flab{font-size:10.5px;color:var(--muted);width:34px;flex:none}
.fchip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  padding:3px 11px;border-radius:99px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--muted);
  backdrop-filter:blur(3px);cursor:pointer;white-space:nowrap;user-select:none;
}
.fchip:hover{border-color:var(--accent)}
.fchip.on{color:var(--ink);border-color:var(--accent)}
.fchip .ck{font-size:11px;width:12px;color:var(--accent);font-weight:700}
.fchip .sw{width:10px;height:10px;border-radius:3px;flex:none;opacity:.35}
.fchip.on .sw{opacity:1}
.route.dimmed{opacity:.08 !important}
.route.focus-dim{opacity:.15 !important}
.routeHit.off{display:none}

#legend{
  position:absolute;left:12px;bottom:12px;z-index:5;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;
  display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink2);
  backdrop-filter:blur(3px);max-width:260px;
}
#legend .lg-title{font-weight:600;color:var(--ink);font-size:11.5px}
#legend .row{display:flex;flex-wrap:wrap;gap:4px 10px}
#legend .it{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
#legend .ln{width:16px;height:0;border-top:2.4px solid var(--base);flex:none}
#legend .ln.data{border-top:2px dashed var(--s3)}
#legend .cap{color:var(--muted);font-size:10.5px}
#panel{
  position:absolute;top:0;right:0;bottom:0;width:372px;z-index:6;
  background:var(--panel);border-left:1px solid var(--border);
  transform:translateX(105%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
#panel.open{transform:none}
#panel .p-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
#panel .p-head h2{font-size:14px;font-weight:600;flex:1}
#panel .p-head .sub{font-size:11px;color:var(--muted)}
#panel .close{font-size:16px;color:var(--muted);padding:2px 8px;border-radius:6px}
#panel .close:hover{background:var(--border);color:var(--ink)}
#panel .p-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.sec-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;display:flex;align-items:center;gap:10px}
.kcard .kl{flex:1;min-width:0}
.kcard .lab{font-size:11px;color:var(--muted)}
.kcard .val{font-size:17px;font-weight:600}
.kcard .val .unit{font-size:11px;color:var(--ink2);font-weight:400}
.kcard .delta{font-size:11px}
.kcard .delta.up{color:var(--delta-good)} .kcard .delta.down{color:var(--delta-bad)}
.kcard svg{flex:none}
.kgrid{display:flex;flex-direction:column;gap:6px}
table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
table.mini th{color:var(--muted);font-weight:500;text-align:right;padding:3px 6px;border-bottom:1px solid var(--border)}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;color:var(--ink2)}
table.mini td:first-child{color:var(--ink)}
.mrk{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.vinItem{padding:6px 9px;border:1px solid var(--border);border-radius:7px;font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.vinItem:hover{border-color:var(--accent)}
.vinItem .vv{font-family:ui-monospace,monospace;color:var(--ink)}
.vinList{display:flex;flex-direction:column;gap:5px}
.chain{display:flex;flex-direction:column}
.chain .st{display:flex;gap:10px;position:relative;padding:0 0 14px 18px}
.chain .st::before{content:"";position:absolute;left:5px;top:5px;bottom:-2px;width:2px;background:var(--base)}
.chain .st:last-child::before{display:none}
.chain .dot{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid var(--panel)}
.chain .dot.svc{background:var(--serious)}
.chain .sn{font-weight:600;font-size:12px}
.chain .sd{color:var(--muted);font-size:11px}
.chain .sl{color:var(--ink2);font-size:11px}
.linkBtn{color:var(--accent);font-size:11.5px;padding:4px 0}
.linkBtn:hover{text-decoration:underline}
.badge-ext{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);border-radius:99px;padding:2px 8px}
.gauge{height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden}
.gauge>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.barRow{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:3px 0}
.barRow .bl{width:86px;color:var(--ink);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barRow .btrack{flex:1;height:13px;position:relative}
.barRow .bfill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.barRow .bv{width:52px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}

#timeline{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-top:1px solid var(--border);background:var(--surface);
}
#playBtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  font-size:14px;color:var(--ink);flex:none;background:var(--panel);
}
#playBtn:hover{border-color:var(--accent)}
#speedBtn{font-size:11.5px;color:var(--ink2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;flex:none}
#curMonth{font-size:16px;font-weight:600;min-width:86px;font-variant-numeric:tabular-nums}
#curTag{font-size:10.5px;color:var(--muted)}
#curTag.sim{color:var(--serious)}
#slider-wrap{flex:1;position:relative;height:30px;display:flex;align-items:center}
#mSlider{width:100%;accent-color:var(--accent);cursor:pointer}
#nowTick{position:absolute;top:0;width:2px;height:9px;background:var(--serious);pointer-events:none}
#nowTickLab{position:absolute;top:-3px;transform:translateX(-50%);font-size:9px;color:var(--serious);pointer-events:none}
#tlRange{font-size:10.5px;color:var(--muted);white-space:nowrap}

#tip{
  position:fixed;z-index:40;pointer-events:none;display:none;max-width:270px;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;font-size:11.5px;box-shadow:0 4px 18px rgba(0,0,0,.35);
}
#tip .t-title{font-weight:600;font-size:12px;margin-bottom:3px}
#tip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip .t-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#modalBack.open{display:block}
#modal{
  position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);
  width:520px;max-width:92vw;max-height:82vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
  display:none;
}
#modal.open{display:block}
#modal h2{font-size:15px;margin-bottom:2px}
#modal .m-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
#modal .close{position:absolute;top:10px;right:12px;font-size:16px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .pulse{animation:none;opacity:.9}
  #panel{transition:none}
}
</style>
</head>
<body>
<header>
  <h1>기아 북미권역 월드 트윈</h1><span class="sub">V6 · 업무 디지털 트윈 (가상 데이터)</span>
  <nav id="crumbs" aria-label="위치"></nav>
  <div class="grow"></div>
  <span id="modeBadge">실적</span>
  <button id="backBtn" hidden>← 뒤로 (ESC)</button>
  <button id="themeBtn">라이트 모드</button>
</header>
<div id="alerts" aria-label="이번 달 알림"></div>
<div id="sceneWrap">
  <svg id="scene" preserveAspectRatio="xMidYMid meet" role="img" aria-label="북미권역 디지털 트윈 씬">
    <defs>
      <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" fill="transparent"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--crit)" stroke-width="2.2"/>
      </pattern>
      <symbol id="car-TEL" viewBox="0 0 48 20">
        <path d="M2 15 L2 9.5 Q2 7.6 4.8 7.1 L12 6 L15.5 2.6 Q16.4 1.8 18.2 1.8 L34 1.8 Q36.2 1.8 37.4 3.4 L40.4 6.4 L44.6 7.3 Q46.4 7.7 46.4 9.8 L46.4 15 Z"/>
        <circle cx="11.5" cy="15" r="3.4" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="36.5" cy="15" r="3.4" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
      <symbol id="car-EV9" viewBox="0 0 48 20">
        <path d="M2 15 L2 9.2 Q2 7.4 4.8 7 L12.5 6 L16 3 Q17 2 19 2 L34.5 2 Q36.6 2 37.7 3.6 L40.6 6.5 L44.6 7.4 Q46.4 7.8 46.4 9.8 L46.4 15 Z"/>
        <path d="M25.4 4.4 l-3.6 5.2 h2.3 l-1.7 4.6 4.5-5.9 h-2.4 l2-3.9 z" fill="var(--surface)"/>
        <circle cx="11.5" cy="15" r="3.4" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="36.5" cy="15" r="3.4" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
      <symbol id="car-SPO" viewBox="0 0 48 20">
        <path d="M2.5 15 L3 10.4 Q3.3 8.4 6 7.8 L13.5 6.6 L17.5 3.4 Q18.5 2.6 20.4 2.6 L31.5 2.6 Q33.6 2.6 35 4.2 L38.4 7 L43.6 8 Q45.6 8.5 45.6 10.4 L45.6 15 Z"/>
        <circle cx="12" cy="15" r="3.2" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="36" cy="15" r="3.2" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
      <symbol id="car-K4" viewBox="0 0 48 20">
        <path d="M2.5 15 L3.4 11 Q3.8 9.4 6.4 9 L14 8 L19 4.6 Q20 3.9 21.8 3.9 L29.5 3.9 Q31.4 3.9 32.8 5.2 L36.6 8.4 L43.4 9.4 Q45.5 9.9 45.5 11.5 L45.5 15 Z"/>
        <circle cx="12.5" cy="15" r="3.1" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="35.5" cy="15" r="3.1" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
      <symbol id="car-CAR" viewBox="0 0 48 20">
        <path d="M2 15 L2 9 Q2 7 4.6 6.6 L9.5 6 L12.5 2.8 Q13.4 2 15.2 2 L38 2 Q41 2 42.8 3.8 L45.6 7.2 Q46.4 8.2 46.4 9.8 L46.4 15 Z"/>
        <circle cx="11" cy="15" r="3.2" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="37.5" cy="15" r="3.2" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
      <symbol id="car-EV6" viewBox="0 0 48 20">
        <path d="M2.5 15 L3.2 10.8 Q3.6 9 6.2 8.5 L13 7.4 L18.5 3.2 Q19.6 2.4 21.5 2.5 L28 3 Q30.4 3.3 32.2 5 L36.8 8.6 L43.5 9.6 Q45.5 10.1 45.5 11.6 L45.5 15 Z"/>
        <path d="M24.6 5 l-3.2 4.6 h2.1 l-1.5 4.1 4-5.2 h-2.1 l1.7-3.5 z" fill="var(--surface)"/>
        <circle cx="12.5" cy="15" r="3.1" stroke="var(--surface)" stroke-width="1.4"/>
        <circle cx="35" cy="15" r="3.1" stroke="var(--surface)" stroke-width="1.4"/>
      </symbol>
    </defs>
    <g id="gMap">
      <g id="gGrat"></g><g id="gLand"></g><g id="gRoutes"></g>
      <g id="gBadges"></g><g id="gParticles"></g><g id="gEntities"></g>
    </g>
    <g id="gInner" style="display:none"></g>
  </svg>
  <div id="zoomCtl">
    <button id="zIn" title="확대">+</button>
    <button id="zOut" title="축소">−</button>
    <button id="zReset" title="뷰 리셋" style="font-size:11px">⌂</button>
  </div>
  <div id="zoomHint">휠 = 줌 (확대할수록 상세) · 드래그 = 이동<br>클릭 = 하위 트윈 진입</div>
  <div id="flowBar" style="display:none" aria-label="흐름 레이어 · 차종 필터"></div>
  <div id="lodBadge"></div>
  <div id="legend"></div>
  <aside id="panel" aria-label="상세 패널">
    <div class="p-head"><h2 id="pTitle"></h2><span class="sub" id="pSub"></span><button class="close" id="pClose">✕</button></div>
    <div class="p-body" id="pBody"></div>
  </aside>
</div>
<div id="timeline">
  <button id="playBtn" title="재생/일시정지">▶</button>
  <button id="speedBtn" title="배속">1×</button>

function resolveCollisions(boxes,iter){

    let moved=false;
    for(let i=0;i<out.length;i++)for(let j=i+1;j<out.length;j++){

function stackItems(counts,unit,cap){

/* ═══════════ 경로 (단계별 재구축) ═══════════ */
let ROUTES=[];
/* 물류 툴팁: 제목 + 구간별 운송 기간 분해 + (선택된) 차종별 당월 대수 */
function flowTip(id,title,m){
  const rows=[[title]];
  const legs=corridorLegs(id);
  if(legs.length){
    rows.push(['운송 기간 (평균, 공장→지역)',legsDays(legs)+'일']);
    legs.forEach(l=>rows.push(['· '+l[0],l[1]+'일']));
  }
  routeModelIds(id).forEach(mid=>{
    if(!selModels.has(mid))return;
    const md=MODELS.find(x=>x.id===mid);
    rows.push([md.name,fmt(Math.round(D.models[mid].ws[m]*routeShare(id)))+'대/월']);
  });
  return rows;
}
function buildRoutes(stage){
  const gR=$('gRoutes'); gR.textContent=''; const R=[];
  const add=(id,d,kind,volFn,tipFn,lodMin)=>{
    const p=svgEl('path',{d,class:'route '+kind},gR);
    const hit=svgEl('path',{d,class:'routeHit'},gR);
    const r={id,el:p,hit,len:p.getTotalLength(),kind,volFn,tipFn,lodMin:lodMin||1,
      layer:routeLayer(id),tags:routeTouchTags(id),days:legsDays(routeLegs(id))};
    hit.addEventListener('pointermove',e=>showTip(e,tipFn(curM)));
    hit.addEventListener('pointerleave',hideTip);
    R.push(r);return r;};
  /* 물류 경로 — 유량은 차종 필터(selModels) 기준으로 실시간 재계산 */
  const addFlow=(id,d,kind,title,lodMin)=>add(id,d,kind,m=>routeFlow(D,id,m,selArr()),m=>flowTip(id,title,m),lodMin);
  if(stage==='subs'){
    Object.keys(CORPS).forEach(k=>add('hq_'+k,curvePath(PT.HQ,PT['C_'+k],0.08),'data',m=>1,
      m=>[['권역본부 ↔ '+CORPS[k].name],['판매·재고·품질 보고 스트림']]));
    NA_PLANTS.forEach(k=>add('hqp_'+k,curvePath(PT.HQ,PT['P_'+k],-0.08),'data',m=>1,
      m=>[['권역본부 ↔ '+PLANTS[k].name],['생산 계획·실적 보고 스트림']]));
  }
  if(stage==='us'){
    KR_PLANTS.forEach(k=>addFlow('kp_'+k,curvePath(PT['P_'+k],PT.PYT,0.15),'thin','육상 — '+PLANTS[k].name+' → 평택항'));
    addFlow('ship',curvePath(PT.PYT,PT.PORT,-0.16),'logi','해상 운송 — 평택항 → 포트 휴니미 (화성 EV6 + 광명 카니발)');
    ZONES.forEach(z=>{
      addFlow('pz_'+z.id,curvePath(PT.PORT,PT['Z_'+z.id],0.08),'thin','철도 — 포트 휴니미 → '+z.name,2);
      addFlow('gz_'+z.id,curvePath(PT.P_GA,PT['Z_'+z.id],-0.07),'thin','트럭/철도 — Kia Georgia → '+z.name,2);
      addFlow('hz_'+z.id,curvePath(PT.P_HM,PT['Z_'+z.id],-0.11),'thin','트럭/철도 — HMGMA → '+z.name,2);
      addFlow('mz_'+z.id,curvePath(PT.P_MX,PT['Z_'+z.id],0.1),'thin','철도 — Kia Mexico → '+z.name,2);
      add('fb_'+z.id,curvePath(PT['Z_'+z.id],PT.C_US,z.lon<-100?-0.18:0.22),'data',m=>1,
        m=>[['피드백 데이터 — '+z.name+' → Kia America'],['Retail 실적 · VoC · 텔레매틱스'],['당월 Retail',fmt(D.zones[z.id].retail[m])+'대']],2);
    });
    NA_PLANTS.forEach(k=>add('ord_'+k,curvePath(PT.C_US,PT['P_'+k],-0.12),'data',m=>1,
      m=>[['월 주문서 — Kia America → '+PLANTS[k].name],['당월 발주',fmt(D.plants[k].prod[Math.min(N_MONTHS-1,curM+PLANTS[k].lead)])+'대']]));
    add('ord_KR',curvePath(PT.C_US,PT.PYT,0.13),'data',m=>1,
      m=>[['월 주문서 — Kia America → 화성·광명'],['당월 발주',fmt(D.plants.HS.prod[Math.min(N_MONTHS-1,curM+2)]+D.plants.GM.prod[Math.min(N_MONTHS-1,curM+2)])+'대']]);
    add('fb_hq',curvePath(PT.C_US,PT.HQ,0.25),'data',m=>1,
      m=>[['보고 스트림 — Kia America → 북미권역본부'],['판매·재고·품질 집계']]);
  }
  ROUTES=R;
}
/* 레이어 토글 · 차종 필터 · 포커스를 경로에 적용 (AND 조합) */
function applyFlowStyles(){
  const us=cur().stage==='us';
  ROUTES.forEach(rt=>{
    const layerOn=!us||layers[rt.layer];
    const vol=rt.layer==='logi'?rt.volFn(curM):1;
    const zero=rt.layer==='logi'&&vol<1;           /* 차종 필터로 흐름 없음 → 8% dim */
    const fDim=focusEnt&&!rt.tags.includes(focusEnt); /* 포커스 외 → 15% dim */
    rt.el.style.display=layerOn?'':'none';
    rt.hit.classList.toggle('off',!layerOn||zero);
    rt.el.classList.toggle('dimmed',layerOn&&zero);
    rt.el.classList.toggle('focus-dim',layerOn&&!zero&&fDim);
    if(rt.layer==='logi'&&!zero){ /* 두께 = 선택 차종 유량 비례 */
      rt.el.style.strokeWidth=(rt.kind==='logi'?clamp(1.4+vol/6000,1.4,5.5):clamp(.8+vol/6000,.8,3.5)).toFixed(2);
    }else rt.el.style.strokeWidth='';
    if(rt.badgeEl)rt.badgeEl.style.display=(layerOn&&!zero&&!fDim)?'':'none';
  });
  if(batchEl)batchEl.grp.style.display=(!us||(layers.logi&&routeFlow(D,'ship',curM,selArr())>0&&(!focusEnt||ROUTES.find(r=>r.id==='ship').tags.includes(focusEnt))))?'':'none';
}
/* 칩 바 — 흐름 레이어 3종 + 차종 6종 (미국 뷰 전용) */
function buildFlowBar(){
  const B=$('flowBar'); B.textContent='';
  const r1=hEl('div','frow',null,B); hEl('span','flab','흐름',r1);
  [['logi','물류 (차량)'],['orders','주문서'],['feedback','피드백 데이터']].forEach(([k,label])=>{
    const c=hEl('button','fchip'+(layers[k]?' on':''),null,r1);
    hEl('span','ck',layers[k]?'✓':'',c); hEl('span',null,label,c);
    c.title=label+' 레이어 '+(layers[k]?'끄기':'켜기');
    c.onclick=()=>{layers=toggleLayer(layers,k);buildFlowBar();rebuildParticles(curM);renderMapEntities(curM);};
  });
  const r2=hEl('div','frow',null,B); hEl('span','flab','차종',r2);
  MODELS.forEach(md=>{
    const on=selModels.has(md.id);
    const c=hEl('button','fchip'+(on?' on':''),null,r2);
    hEl('span','ck',on?'✓':'',c);
    const sw=hEl('span','sw',null,c); sw.style.background=slotColor(md.slot);
    hEl('span',null,md.name,c);
    c.onclick=()=>{
      if(on&&selModels.size===1)return; /* 최소 1개 유지 */

      buildFlowBar();rebuildParticles(curM);renderMapEntities(curM);
    };
  });
}

/* ═══════════ 툴팁 ═══════════ */
const tip=$('tip');
function showTip(e,rows){
  tip.textContent='';
  rows.forEach((r,i)=>{
    if(r.length===1)hEl('div',i===0?'t-title':'t-row',r[0],tip);
    else{const d=hEl('div','t-row',null,tip);hEl('span',null,r[0],d);hEl('b',null,r[1],d);}
  });
  tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(innerWidth-w-10,e.clientX+14)+'px';
  tip.style.top=Math.min(innerHeight-h-10,e.clientY+12)+'px';
}
function hideTip(){tip.style.display='none'}
/* ═══════════ 차량 아이콘 스택 렌더 ═══════════ */
function slotColor(slot){return `var(--s${slot})`}
let clipSeq=0;
function renderStack(g,counts,unit,cap,x0,y0,iw,cols){
  const items=stackItems(counts,unit,cap), ih=iw*20/48+2;
  items.forEach((it,i)=>{
    const md=MODELS.find(x=>x.id===it.id);
    const x=x0+(i%cols)*(iw+2), y=y0+Math.floor(i/cols)*ih;
    const u=svgEl('use',{href:'#car-'+it.id,x,y,width:iw,height:iw*20/48,
      style:`color:${slotColor(md.slot)}`},g);
    if(it.frac<1){
      const cid='clp'+(clipSeq++);
      const cp=svgEl('clipPath',{id:cid},g);
      svgEl('rect',{x,y,width:iw*it.frac,height:iw*20/48},cp);
      u.setAttribute('clip-path',`url(#${cid})`);
    }
    u.addEventListener('pointermove',e=>{const c=counts.find(c=>c.id===it.id);
      showTip(e,[[md.name],['재고',fmt(c.count)+'대'],['스케일','차 1대 그림 = '+fmt(unit)+'대']]);});
    u.addEventListener('pointerleave',hideTip);
  });
}

/* ═══════════ LOD 엔티티 렌더 (화면 픽셀 고정 · 밴드별 상세도 · 충돌 해소) ═══════════ */
function lampText(g,x,y,sev,label){
  const col=sev==='crit'?'var(--crit)':sev==='serious'?'var(--serious)':sev==='warn'?'var(--warn)':'var(--good)';
  const ic=sev==='crit'?'⛔':sev==='serious'?'◆':sev==='warn'?'▲':'●';
  const t=svgEl('text',{x,y,class:'lamp-label',text:ic+' '+label},g);
  t.setAttribute('fill',col);return t;
}
function cardSize(def,band){
  const t=def.type;
  if(t==='hq')return def.detail?[210,92]:[64,20];
  if(band===1)return [58,26]; /* 핀+약어 공간 (충돌 계산용) */
  if(t==='corp')return band===2?[150,48]:(def.key==='US'?[178,80]:[158,62]);
  if(t==='plant')return band===2?[152,46]:[178,92];
  if(t==='zone')return band===2?[158,52]:[200,166];
  if(t==='cluster')return [120,44];
  if(t==='pin')return [70,24];
  if(t==='krchip')return [176,26];
  return [120,40];
}
function plantLamp(pid,m){
  const P=D.plants[pid];
  if(evFactor(pid,m)<1)return ['crit','설비 이상 — 생산 차질'];
  if(P.util[m]>.97)return ['warn','케파 상한 근접'];
  return ['good','정상 가동'];
}
function stageEntityDefs(stage){
  const L=[];
  if(stage==='region'){L.push({id:'hq',type:'hq',pt:PT.HQ,detail:true});return L;}
  L.push({id:'hq',type:'hq',pt:PT.HQ,detail:false});
  Object.keys(CORPS).forEach(k=>L.push({id:'corp:'+k,type:'corp',key:k,pt:PT['C_'+k]}));
  NA_PLANTS.forEach(k=>L.push({id:'plant:'+k,type:'plant',key:k,pt:PT['P_'+k]}));
  if(stage==='us'){
    KR_PLANTS.forEach(k=>L.push({id:'plant:'+k,type:'plant',key:k,pt:PT['P_'+k]}));
    L.push({id:'pin:PORT',type:'pin',key:'PORT',pt:PT.PORT});
    L.push({id:'pin:PYT',type:'pin',key:'PYT',pt:PT.PYT});
    L.push({id:'krchip',type:'krchip',pt:PT.KRCHIP});
    ZONES.forEach(z=>L.push({id:'zone:'+z.id,type:'zone',key:z.id,pt:PT['Z_'+z.id]}));
  }
  return L;
}
function renderMapEntities(m){
  const g=$('gEntities'); g.textContent='';
  const gB=$('gBadges'); gB.textContent='';
  const r=scene.getBoundingClientRect();
  if(!r.width)return;
  const s=Math.min(r.width/vb.w,r.height/vb.h);
  const z=zoomOf(vb);
  curBand=bandFor(z,curBand);
  $('lodBadge').textContent=`줌 ${z.toFixed(1)}× · 상세도 ${curBand===1?'Ⅰ (핀)':curBand===2?'Ⅱ (요약)':'Ⅲ (상세)'}`;
  const stage=cur().stage;
  let defs=stageEntityDefs(stage);
  /* 밴드 Ⅰ·Ⅱ: 공장 핀 클러스터 (화성·광명 등 근접 공장 묶기) */
  if(curBand<3){
    const plantDefs=defs.filter(d=>d.type==='plant');
    const pins=plantDefs.map(d=>({id:d.key,x:d.pt[0]*s,y:d.pt[1]*s}));
    const cls=clusterPins(pins,52);
    cls.filter(c=>c.ids.length>1).forEach((c,i)=>{
      defs=defs.filter(d=>!(d.type==='plant'&&c.ids.includes(d.key)));
      defs.push({id:'cluster:'+c.ids.join('+'),type:'cluster',ids:c.ids,pt:[c.x/s,c.y/s]});
    });
  }
  /* 충돌 해소 (화면 px 공간) */
  const boxes=defs.map(d=>{
    const [w,h]=cardSize(d,curBand);
    const px=d.pt[0]*s, py=d.pt[1]*s;
    return {id:d.id,x:px-w/2,y:py-h-9,w,h,ax:px,ay:py,def:d};
  });
  const solved=(defs.length>1?resolveCollisions(boxes):boxes);
  solved.forEach(b=>{
    const d=b.def;
    const grp=svgEl('g',{class:'entity','data-entity':d.id,
      transform:`translate(${d.pt[0]},${d.pt[1]}) scale(${(1/s).toFixed(5)})`},g);
    const ox=b.x-b.ax, oy=b.y-b.ay; /* 앵커 기준 카드 오프셋(px) */
    /* 리더 라인 + 앵커 점 */
    if(Math.abs(ox+b.w/2)>b.w/2+4||oy<-b.h-26){
      svgEl('path',{d:`M0 0 L${(ox+b.w/2).toFixed(1)} ${(oy+b.h).toFixed(1)}`,class:'leader'},grp);
    }
    svgEl('circle',{cx:0,cy:0,r:3,class:'anchor-dot'},grp);
    drawCard(grp,d,curBand,m,ox,oy,b.w,b.h);
    /* 엔티티 포커스 — 호버 시 연결 경로만 정상, 나머지 15% dim */
    if(stage==='us'&&d.type!=='krchip'&&d.type!=='cluster'){
      grp.addEventListener('pointerenter',()=>{focusEnt=d.id;applyFlowStyles();});
      grp.addEventListener('pointerleave',()=>{if(focusEnt===d.id){focusEnt=null;applyFlowStyles();}});
    }
  });
  drawRouteBadges(gB,m,s,curBand);
  drawBatchMarker(gB,m,s,stage);
  applyFlowStyles();
}

/* ═══════════ 파티클 ═══════════ */
let parts=[],laneCars=[],lastTs=null;
function rebuildParticles(m){
  parts=[]; const gP=$('gParticles'); gP.textContent='';
  if(REDUCED)return;
  const us=cur().stage==='us';
  ROUTES.forEach(r2=>{
    if(us&&!layers[r2.layer])return;                      /* 꺼진 레이어 → 파티클 없음 */
    if(r2.layer==='logi'&&r2.volFn(m)<1)return;           /* 차종 필터로 유량 0 → 없음 */
    let n;
    if(r2.kind==='logi')n=clamp(Math.round(r2.volFn(m)/5000),2,6);
    else if(r2.kind==='thin')n=clamp(Math.round(r2.volFn(m)/4500),0,3);
    else n=2;
    for(let i=0;i<n;i++)parts.push({r:r2,t:(i/n+(hash32(r2.id)%13)/13)%1,
      sp:(r2.kind==='data'?.085:.04)*(0.8+((i*37)%10)/22)});
  });
  parts=parts.slice(0,120);
  parts.forEach(p=>{p.el=svgEl('circle',{r:p.r.kind==='logi'?3:p.r.kind==='thin'?2.1:1.7,
    class:p.r.kind==='data'?'particle-data':'particle-logi'},gP)});
}
function raf(ts){
  const dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0; lastTs=ts;
  if(vbAnim)vbAnim(ts);
  if(!REDUCED&&!document.hidden){
    if(isMapStage())parts.forEach(p=>{
      p.t=(p.t+p.sp*dt)%1;
      const pt=p.r.el.getPointAtLength(p.r.len*p.t);
      p.el.setAttribute('cx',pt.x.toFixed(1));p.el.setAttribute('cy',pt.y.toFixed(1));});
    else laneCars.forEach(c=>{
      if(c.stopped)return;
      c.x+=c.sp*dt; if(c.x>c.x1)c.x=c.x0;
      c.el.setAttribute('x',c.x.toFixed(1));});
  }
  requestAnimationFrame(raf);
}

function activateEntity(idstr){
  const [t,k]=idstr.split(':');
  const st=cur().stage;
  if(t==='hq'){
    if(st==='region'){stack=navPush(stack,{stage:'subs'});applyStage(true);}
    else openHqModal();
    return;
  }
  if(t==='corp'){
    if(k==='US'){
      if(st==='subs'){stack=navPush(stack,{stage:'us'});applyStage(true);}
      else{stack=navPush(stack,{stage:'corp'});applyStage(false);}
    }else openAggModal(k);
    return;
  }
  if(t==='plant'){stack=navPush(stack,{stage:'plant',id:k});applyStage(false);return;}
  if(t==='zone'){stack=navPush(stack,{stage:'zone',id:k});applyStage(false);return;}
  if(t==='cluster'){ /* 근접 공장 묶음 → 해당 영역으로 줌인 */
    const ids=k.split('+');
    const lons=ids.map(p=>PLANTS[p].lon),lats=ids.map(p=>PLANTS[p].lat);

      lat0:Math.min(...lats)-1.2,lat1:Math.max(...lats)+1.2},60),500);
    return;
  }

}

function sparkSvg(vals,m,w,h){
  const svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('width',w);svg.setAttribute('height',h);
  const a=Math.max(0,m-11),seg=vals.slice(a,m+1);
  const mn=Math.min(...seg),mx=Math.max(...seg),rg=mx-mn||1;
  const pts=seg.map((v,i)=>`${(i/(seg.length-1)*(w-8)+4).toFixed(1)},${(h-5-(v-mn)/rg*(h-10)).toFixed(1)}`);
  svgEl('polyline',{points:pts.join(' '),fill:'none',stroke:'var(--base)','stroke-width':1.6},svg);
  const last=pts[pts.length-1].split(',');
  svgEl('circle',{cx:last[0],cy:last[1],r:3,fill:'var(--accent)',stroke:'var(--surface)','stroke-width':1.5},svg);
  return svg;
}
function kcard(body,label,val,unit,delta,goodUp,vals,m){
  const c=hEl('div','kcard',null,body);
  const kl=hEl('div','kl',null,c);
  hEl('div','lab',label,kl);
  const v=hEl('div','val',val,kl); if(unit)hEl('span','unit',' '+unit,v);
  if(delta!=null){
    const up=delta>=0, good=(up===goodUp);
    hEl('div','delta '+(good?'up':'down'),(up?'▲ +':'▼ ')+Math.abs(delta).toFixed(1)+'%',kl);
  }
  if(vals)c.appendChild(sparkSvg(vals,m,74,30));
}

  $('curTag').classList.toggle('sim',curM>NOW);
  const st=cur().stage;
  if(MAP_STAGES.includes(st)){renderMapEntities(curM);rebuildParticles(curM);positionBatch(curM);}
  else{laneCars=[];
    if(st==='corp')renderCorpScene(curM);
    else if(st==='plant')renderPlantScene(curM);
    else renderZoneScene(curM);}
}
function setMonth(m){curM=clamp(m,0,N_MONTHS-1);$('mSlider').value=curM;update();}
$('mSlider').addEventListener('input',e=>setMonth(+e.target.value));
$('playBtn').onclick=()=>{
  playing=!playing;$('playBtn').textContent=playing?'❚❚':'▶';
  clearInterval(timer);
  if(playing)timer=setInterval(()=>{
    if(curM>=N_MONTHS-1){playing=false;$('playBtn').textContent='▶';clearInterval(timer);return;}
    setMonth(curM+1);
  },900/speed);
};
$('speedBtn').onclick=()=>{
  speed=speed===1?2:speed===2?4:1;$('speedBtn').textContent=speed+'×';
  if(playing){$('playBtn').click();$('playBtn').click();}
};
(function(){
  const pct=NOW/(N_MONTHS-1)*100;
  $('nowTick').style.left=`calc(8px + (100% - 16px) * ${pct/100})`;
  $('nowTickLab').style.left=`calc(8px + (100% - 16px) * ${pct/100})`;
})();
$('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const dark=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme',dark?'light':'dark');
  $('themeBtn').textContent=dark?'다크 모드':'라이트 모드';
};
window.addEventListener('resize',scheduleEntityRender);
drawStatic();buildLegend();
applyVB();applyStage(false);
setMonth(NOW);
requestAnimationFrame(raf);
</script>
</body>
</html>
