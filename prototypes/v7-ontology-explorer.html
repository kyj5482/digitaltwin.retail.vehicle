<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V7 온톨로지 탐색기 — 미국판매법인 비즈니스 온톨로지</title>
<!--
  온톨로지 탐색기 — 데이터가 어떤 객체·관계·액션으로 구성되는지 그 자체를 보여주는 화면.
  (Palantir 비행기 온톨로지 스타일: 타입 그래프 → 인스턴스 → 링크 순회 → 수명주기)
  정의: v7-ontology.js (시멘틱 레이어 선언) / 표본 인스턴스: v7-ontology-instances.js
  시각화: Cytoscape.js 3.30 (vendor/, ⭐11k) — 타입 그래프 줌/팬/하이라이트
-->
<style>
:root{
  /* 중립(크롬) 토큰 — v8 전략 트윈과 동일 팔레트 (임베드 시 이질감 없이 이어지도록 통일) */
  --bg:#161614; --panel:#1e1e1c; --panel2:#262623; --panel3:#2e2e2b;
  --border:#33332f; --text:#f0efec; --muted:#a3a199; --dim:#8f8d85;
  --edge:#6e6e67; --edge-hi:#79b8ff;
  /* 그룹 마크색 — 다크 표면 검증 통과(validate_palette, 인접쌍) · 열 분리+라벨 병행 */
  --g-org:#3987e5; --g-product:#d95926; --g-plan:#199e70; --g-logistics:#c98500;
  --g-commerce:#d55181; --g-care:#008300; --g-quality:#9085e9;
  /* 상태 배지 (항상 텍스트 라벨 동반) */
  --st-bound:#0ca30c; --st-planned:#fab219; --st-derived:#79b8ff;
  --pass:#0ca30c; --hold:#fab219; --safety:#d03b3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:13px/1.45 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;   /* v8과 동일 글꼴 스택 */
  display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}

/* ── 헤더 ── */
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);flex:none}
header h1{font-size:15px;font-weight:600}
header .sub{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:none;border:1px solid transparent;color:var(--muted);font-size:12.5px;padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.on{color:var(--text);background:var(--panel3);border-color:var(--border);font-weight:600}
.stats{margin-left:auto;display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.stats b{color:var(--text);font-weight:600}

/* ── 공통 ── */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;border:1px solid;letter-spacing:.03em;vertical-align:1px}
.badge.bound{color:var(--st-bound);border-color:var(--st-bound)}
.badge.planned{color:var(--st-planned);border-color:var(--st-planned)}
.badge.derived{color:var(--st-derived);border-color:var(--st-derived)}
.gdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mono{font-family:ui-monospace,Menlo,monospace}
.muted{color:var(--muted)}
main{flex:1;display:none;min-height:0}
main.on{display:flex}

/* ── 탭1: 그래프 ── */
#cy{flex:1;min-width:0}
.side{width:400px;flex:none;border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:16px}
/* ── 정보 패널 접기 — 온톨로지 정보가 차지하는 가로 면적을 줄여 관계 뷰를 넓게 ── */
#sideToggle{flex:none;width:16px;border:none;border-left:1px solid var(--border);background:var(--panel);
  color:var(--muted);cursor:pointer;font-size:10px;padding:0}
#sideToggle:hover{color:var(--edge-hi);background:var(--panel2)}
body.sideMin #sidePanel{display:none}
.side h2{font-size:14px;font-weight:600;margin-bottom:2px}
.side .en{font-size:11px;color:var(--muted);margin-bottom:8px}
.side p.desc{font-size:12px;color:var(--muted);line-height:1.65;margin:8px 0 12px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 10px;font-size:11.5px}
.kv .k{color:var(--muted)}
table.props{width:100%;border-collapse:collapse;font-size:11.5px}
table.props th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;padding:3px 6px;border-bottom:1px solid var(--border)}
table.props td{padding:3.5px 6px;border-bottom:1px solid var(--panel3);vertical-align:top}
table.props tr:last-child td{border-bottom:none}
.role{font-size:9px;font-weight:700;padding:0 5px;border-radius:7px;border:1px solid var(--border);color:var(--muted)}
.role.key{color:var(--edge-hi);border-color:var(--edge-hi)}
.role.measure{color:var(--g-plan);border-color:var(--g-plan)}
.role.status{color:var(--st-planned);border-color:var(--st-planned)}
.linkrow{display:flex;align-items:baseline;gap:7px;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--panel3);cursor:pointer}
.linkrow:last-child{border-bottom:none}
.linkrow:hover .lname{color:var(--edge-hi)}
.linkrow .lname{font-weight:600}
.linkrow .dir{color:var(--muted);font-size:10px}
.actrow{padding:6px 0;border-bottom:1px solid var(--panel3);font-size:11.5px}
.actrow:last-child{border-bottom:none}
.actrow b{font-weight:600}
.actrow .fx{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.5}
.btn{display:inline-block;background:var(--panel3);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;margin-top:4px}
.btn:hover{border-color:var(--edge-hi);color:var(--edge-hi)}
.btn.twinBtn{border-color:var(--st-derived);color:var(--st-derived);font-size:11px;padding:4px 10px;margin-top:6px}
.btn.twinBtn:hover{background:var(--panel2)}
.hint{font-size:11px;color:var(--dim);line-height:1.7}

/* ── 탭2: 객체 탐색 ── */
.col-types{width:230px;flex:none;border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:10px 0}
.col-types .grp{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;padding:10px 14px 4px}
.trow{display:flex;align-items:center;gap:4px;padding:5px 14px;cursor:pointer;font-size:12px}
.trow:hover{background:var(--panel2)}
.trow.on{background:var(--panel3);font-weight:600}
.trow .cnt{margin-left:auto;color:var(--muted);font-size:11px}
.col-list{width:330px;flex:none;border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column}
.col-list .lhead{padding:12px 14px 8px;border-bottom:1px solid var(--border);flex:none}
.col-list .lhead h2{font-size:13.5px;font-weight:600}
.col-list .lhead .n{color:var(--muted);font-size:11.5px}
.col-list input{width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-size:12px;padding:6px 10px;outline:none}
.col-list input:focus{border-color:var(--edge-hi)}
.ilist{flex:1;overflow-y:auto}
.irow{padding:8px 14px;border-bottom:1px solid var(--panel2);cursor:pointer}
.irow:hover{background:var(--panel)}
.irow.on{background:var(--panel2)}
.irow .t{font-size:12.5px;font-weight:600}
.irow .s{font-size:11px;color:var(--muted);margin-top:1px}
.col-obj{flex:1;min-width:0;overflow-y:auto;padding:16px 20px;background:var(--bg)}
.crumbs{font-size:11.5px;color:var(--muted);margin-bottom:10px;min-height:16px}
.crumbs a{color:var(--edge-hi);cursor:pointer;text-decoration:none}
.objtitle{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.objtitle h2{font-size:16px;font-weight:600}
.typechip{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;border:1.5px solid;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);cursor:pointer}
.chip:hover{border-color:var(--edge-hi);color:var(--edge-hi)}
.chip .cty{color:var(--muted);font-size:10px;margin-right:5px}
.section{margin-top:16px}
.section h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}

/* 수명주기 스트립 */
.lifecycle{display:flex;align-items:flex-start;gap:0;margin:10px 0 4px;overflow-x:auto;padding-bottom:6px}
.lstate{min-width:96px;text-align:center;position:relative}
.lstate .box{border:1.5px solid var(--border);border-radius:7px;padding:7px 6px;font-size:11px;color:var(--dim);background:var(--panel)}
.lstate.done .box{border-color:var(--g-plan);color:var(--text)}
.lstate.now .box{border-color:var(--edge-hi);color:var(--text);background:var(--panel3);font-weight:700;box-shadow:0 0 0 3px rgba(121,184,255,.15)}
.lgate{width:78px;flex:none;text-align:center;padding-top:5px}
.lgate .g{font-size:9px;font-weight:700;border:1px solid var(--border);border-radius:8px;padding:1px 6px;color:var(--muted);display:inline-block}
.lgate.pass .g{color:var(--pass);border-color:var(--pass)}
.lgate.hold .g{color:var(--hold);border-color:var(--hold)}
.lgate .arr{color:var(--edge);font-size:12px;line-height:1;margin-top:3px}
.lgate .gn{font-size:9px;color:var(--dim);margin-top:2px;line-height:1.3}

/* ── 탭3: 액션·수명주기 ── */
.actions-wrap{flex:1;overflow-y:auto;padding:20px 26px}
.actions-wrap h2{font-size:14px;font-weight:600;margin:4px 0 10px}
.actions-wrap .lead{font-size:12px;color:var(--muted);line-height:1.7;max-width:920px;margin-bottom:14px}
#lifecycleSvg{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:block;max-width:1180px;width:100%}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;max-width:1180px;margin-top:8px}
.stagecard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stagecard h3{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center}
.extguide{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--edge-hi);border-radius:10px;
  padding:14px 18px;max-width:1180px;margin:18px 0 8px;font-size:12px;line-height:1.9;color:var(--muted)}
.extguide b{color:var(--text)}

/* ── 그래프 툴바 (레이아웃 전환) ── */
#viewG{position:relative}
.cytools{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:4px;
  background:rgba(30,30,28,.88);border:1px solid var(--border);border-radius:8px;padding:4px}
.cytools button{background:none;border:1px solid transparent;color:var(--muted);font-size:11.5px;padding:4px 11px;border-radius:5px;cursor:pointer}
.cytools button:hover{color:var(--text)}
.cytools button.on{color:var(--text);background:var(--panel3);border-color:var(--border);font-weight:600}
.cytools #btnFocus{color:var(--edge-hi);border-color:var(--edge-hi);font-weight:600}
.cytools .kbd{font-size:9px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--dim);margin-left:4px;vertical-align:1px}
.cytools #focusCrumb{font-size:11.5px;color:var(--muted);padding:4px 8px;align-self:center;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cytools #twinClock{font-size:11.5px;color:var(--muted);padding:4px 10px;align-self:center;border-left:1px solid var(--border);font-family:ui-monospace,monospace}

/* ── 탭4: 데이터 파이프라인 ── */
#pipelineSvg{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:block;max-width:1180px;width:100%}
table.bind{width:100%;max-width:1180px;border-collapse:collapse;font-size:11.5px;background:var(--panel);border:1px solid var(--border)}
table.bind th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--panel2)}
table.bind td{padding:6px 10px;border-bottom:1px solid var(--panel3);vertical-align:top}
table.bind tr:last-child td{border-bottom:none}
table.bind tr:hover td{background:var(--panel2)}
.wave{display:flex;align-items:baseline;gap:12px;max-width:1180px;padding:8px 0;border-bottom:1px solid var(--panel3)}
.wave:last-child{border-bottom:none}
.wave .wno{flex:none;font-size:10.5px;font-weight:700;color:var(--edge-hi);border:1px solid var(--edge-hi);border-radius:9px;padding:1px 9px;white-space:nowrap}
pre.code{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;color:var(--text);max-width:1180px;overflow-x:auto}
pre.code .c{color:var(--dim)}
pre.code .k{color:var(--edge-hi)}
/* 개요(설명문) 접기 — 기본 접힘, 클릭 시에만 펼침 */
.introDesc{margin:10px 0}
.introDesc summary{cursor:pointer;color:var(--muted);font-size:12px;padding:5px 0;list-style-position:inside}
.introDesc summary:hover{color:var(--edge-hi)}
.introDesc[open] summary{color:var(--text)}
/* ── 임베드 모드 (트윈 오버레이 안) — 탐색기 크롬 숨김, 관계 뷰만 노출 ── */
body.embed header{display:none}
/* ── 디지털 트윈 데이터 뷰 — 관계 뷰 영역 전체를 덮는 오버레이 (Y축 = 관계 뷰와 동일) ── */
#graphCol{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#graphCol #cy{flex:1;min-height:0}
/* z 6 = 그래프 툴바(.cytools z5)보다 위 — 열려 있는 동안 관계 뷰 컨트롤을 완전히 대체 */
#twinPanel{display:none;position:absolute;inset:0;z-index:6;border-top:2px solid var(--st-derived);background:var(--bg);flex-direction:column}
#twinPanel.on{display:flex}
.twHead{display:flex;align-items:center;gap:12px;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--panel);font-size:12px;flex:none}
.twHead b{color:var(--st-derived)}
.twHead select{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:11.5px;padding:4px 8px;border-radius:6px;max-width:380px}
.twHead .kbd2{font-size:9px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--dim)}
#twBody{flex:1;position:relative;min-height:0}
/* maplibre-gl.css(.maplibregl-map{position:relative})가 나중에 로드돼도 이기도록 ID 셀렉터로 명시 */
#twBody .twView{position:absolute !important;inset:0;display:none}
#twBody .twView.on{display:block}
#dtcBoard{overflow-y:auto;padding:14px 18px}
/* ── 데이터 뷰 글꼴·팔레트 통일 — maplibre가 주입하는 Helvetica/흰 팝업을 본문 디자인 토큰으로 오버라이드
   (maplibre-gl.css가 나중에 로드되므로 ID 셀렉터로 우선순위 확보) ── */
#twBody .maplibregl-map{font:12px/1.45 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#twBody .maplibregl-popup-content{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#twBody .maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--panel2)}
#twBody .maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--panel2)}
#twBody .maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--panel2)}
#twBody .maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--panel2)}
#twBody code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--edge-hi)}
#twBody .maplibregl-ctrl-group{background:var(--panel2);border:1px solid var(--border);box-shadow:none}
#twBody .maplibregl-ctrl-group button+button{border-top:1px solid var(--border)}
#twBody .maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(.85)}
#twBody .maplibregl-ctrl-attrib{background:rgba(30,30,28,.75);font-size:10px}
#twBody .maplibregl-ctrl-attrib,#twBody .maplibregl-ctrl-attrib a{color:var(--muted)}
/* 세로 스크롤 — v8 트윈과 같은 색으로 이어지게 (임베드 시 경계 없이 연속) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a3a36;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
html{scrollbar-color:#3a3a36 transparent}
/* 딥링크 베일 — 해시 상태(#focus:/#act:) 적용이 끝날 때까지 기본 뷰를 가리는 커버.
   V10 트윈 월드에서 링크로 진입·재소환될 때 이전/기본 제목줄이 잠깐 보였다가
   다시 바뀌는 재로드 플래시 방지 — 상태가 선적용된 뒤에만 페인트를 보여준다. */
#dlVeil{position:fixed;inset:0;background:var(--bg);z-index:2000;pointer-events:none;opacity:1;transition:opacity .22s ease}
#dlVeil.off{opacity:0}
</style>
</head>
<body>
<div id="dlVeil" hidden></div>
<script>/* 딥링크 진입이면 첫 페인트 전에 베일부터 — 기본 제목줄 노출(플래시) 차단 */
if (location.hash.length > 1) document.getElementById('dlVeil').hidden = false;</script>
<header>
  <div>
    <h1><span id="entName">미국판매법인</span> 비즈니스 온톨로지 <span class="mono muted" id="ontVer"></span></h1>
    <div class="sub">parquet 데이터 마트 위 시멘틱 레이어 — 객체 · 링크 · 액션 · 수명주기 선언 (v7-ontology.js)</div>
  </div>
  <nav class="tabs">
    <button id="tabG" class="on">온톨로지 그래프</button>
    <button id="tabE">객체 탐색</button>
    <button id="tabA">액션 · 수명주기</button>
    <button id="tabP">데이터 파이프라인</button>
  </nav>
  <div class="stats" id="hdrStats"></div>
</header>

<main id="viewG" class="on">
  <div class="cytools" id="graphTools" style="display:none">
    <button id="btnBack" style="display:none">← 이전 <span class="kbd">ESC</span></button>
    <span id="focusCrumb" style="display:none"></span>
    <span id="twinClock" style="display:none" title="전략 트윈의 Play 커서와 동기화 — 카드 측정값이 이 월 기준"></span>
    <button id="btnFocus" style="display:none"></button>
  </div>
  <div id="graphCol">
    <div id="cy"></div>

  const focusStack = [];     // 드릴다운 경로 (이전 버튼 · ESC로 역순 복귀)
  window._focusDebug = { get focusOn() { return focusOn; }, get stack() { return [...focusStack]; } };
  // 트윈 Play 연동 — 커서 월의 측정값을 카드에 표기 (객체 타입 → 월별 측정값 서술)
  const fmtI = v => Math.round(v).toLocaleString();
  const TIME_LINE = {
    salesCompany: c => `영업이익 $${(c.op / 1e6).toFixed(0)}M/월 (BP $${(c.bpOp / 1e6).toFixed(0)}M)`,
    wholesale: c => `도매 ${fmtI(c.ws)}대/월`,
    vehiclePurchase: c => `법인간 매입 ${fmtI(c.ws)}대/월 (도매 연동)`,
    retailSale: c => `소매 ${fmtI(c.retail)}대/월 (BP ${fmtI(c.bpRetail)})`,
    vehicle: c => `재고 ${fmtI(c.stock)}대 · DS ${Math.round(c.ds)}일`,
    businessPlan: c => `소매 목표 ${fmtI(c.bpRetail)}대/월`,
    customer: c => `외부 CSI ${c.csi.toFixed(1)}`,
    incentiveProgram: c => `평균 인센티브 $${fmtI(c.inc)}/대`,
    marketingCampaign: c => `마케팅 $${c.mkt.toFixed(1)}M/월`,
    allocation: c => `배분 ≈${fmtI(c.ws)}대/월 (도매 선행)`,
    dealer: c => `딜러 재고 ${fmtI(c.stock)}대 · DS ${Math.round(c.ds)}일`,
  };
  function focusLabel(t) {
    const keys = DB.byType[t.id] || [];
    const sample = keys.length ? DB.objects[keys[0]].title : '표본 없음';
    const more = keys.length > 1 ? ` 외 ${(keys.length - 1).toLocaleString()}건` : '';
    const props = t.properties.slice(0, 4).map(p => p.name).join(', ');
    const tc = window._twinTime;
    const timeLn = tc && TIME_LINE[t.id]
      ? `\n⏱ ${TIME_LINE[t.id](tc)} — ${tc.ym}${tc.sim ? ' 시뮬' : ''}` : '';
    return `${t.name} · ${t.en}\n${'─'.repeat(18)}\n객체: ${sample}${more}\n속성: ${props}${timeLn}`;
  }
  function applyFocusMode(id) {
    focusOn = id;
    const hood = cy.getElementById(id).closedNeighborhood();
    const inHood = new Set(hood.map(x => x.id()));
    cy.batch(() => {
      cy.elements().removeClass('dim hi');
      cy.nodes('[isGroup]').addClass('ghost');
      cy.edges().style({ 'curve-style': 'straight' });   // 방사형 스포크는 직선으로
      cy.nodes('[!isGroup]').forEach(n => {
        if (!OT[n.id()]) return;
        const on = inHood.has(n.id());
        n.toggleClass('hidden', !on);
        n.toggleClass('focus', on);
        n.toggleClass('focus-center', n.id() === id);
        n.data('label', on ? focusLabel(OT[n.id()]) : n.data('label0'));
      });
      cy.edges().forEach(e => {
        const on = inHood.has(e.id());
        e.toggleClass('hidden', !on);
        e.toggleClass('focus', on);
      });
    });
    // 방사 배치: 중심 = 선택 객체의 밸류체인 좌표, 이웃은 그룹(밸류체인) 순으로 타원 링에
    const gOrd = Object.fromEntries(O.groups.map(g => [g.id, g.order]));
    const center = posCol[id];
    const neigh = hood.nodes().toArray().filter(n => n.id() !== id)
      .sort((a, b) => (gOrd[OT[a.id()].group] - gOrd[OT[b.id()].group]) || a.id().localeCompare(b.id()));
    const R = Math.max(430, neigh.length * 72);
    cy.nodes('[!isGroup]').stop(true);
    cy.getElementById(id).animate({ position: { x: center.x, y: center.y } }, { duration: 350, easing: 'ease-in-out' });
    neigh.forEach((n, i) => {
      const ang = -Math.PI / 2 + (i * 2 * Math.PI) / neigh.length;
      n.animate({ position: { x: center.x + R * Math.cos(ang), y: center.y + R * 0.72 * Math.sin(ang) } },
        { duration: 350, easing: 'ease-in-out' });
    });
    setTimeout(() => cy.animate({ fit: { eles: hood, padding: 60 }, duration: 250 }), 360);
  }
  function exitFocus(withPositions) {
    if (!focusOn) return;
    focusOn = null;
    cy.batch(() => {
      cy.elements().removeClass('hidden focus focus-center');
      cy.nodes('[isGroup]').removeClass('ghost');
      cy.edges().style({ 'curve-style': 'taxi', 'taxi-direction': 'auto' });
      cy.nodes('[!isGroup]').forEach(n => { if (n.data('label0')) n.data('label', n.data('label0')); });
    });
    if (withPositions) {
      cy.nodes('[!isGroup]').stop(true).forEach(n =>
        n.animate({ position: posCol[n.id()] }, { duration: 350, easing: 'ease-in-out' }));
      setTimeout(() => cy.animate({ fit: { eles: cy.elements(':visible'), padding: 40 }, duration: 250 }), 360);
    }
  }
  function enterFocusView(id) {
    if (!OT[id]) return;
    if (focusOn) { if (focusOn !== id) focusStack.push(focusOn); }
    else focusStack.length = 0;
    pinnedId = id; hoverId = null; cancelClear();
    applyFocusMode(id);
    updateTools();
  }
  function goBack() {   // ESC · [← 이전] · 포커스 중 배경 클릭
    if (!focusOn) return;
    const prev = focusStack.pop();
    if (prev) { pinnedId = prev; hoverId = null; applyFocusMode(prev); renderTypePanel(prev); }
    else {
      const last = focusOn;
      exitFocus(true);
      pinnedId = last; applyFocus(last); renderTypePanel(last);   // 그래프 복귀 후에도 마지막 객체는 고정 유지
    }
    updateTools();
  }
  window._enterFocus = enterFocusView;   // 사이드패널 버튼에서 호출
  // 트윈 Play 동기화 수신 — v8이 커서(월) 이동마다 호출. 과거=실적, 미래=시뮬레이션 예측.
  window._setTwinTime = ctx => {
    window._twinTime = ctx;
    const el = document.getElementById('twinClock');
    el.style.display = '';
    el.innerHTML = `⏱ ${ctx.ym} <b style="color:${ctx.sim ? 'var(--st-planned)' : 'var(--st-bound)'}">${ctx.sim ? '시뮬 · 미래 예측' : '실적'}</b>`;
    updateTools();
    if (focusOn) cy.batch(() => cy.nodes('.focus').forEach(n => {   // 카드 측정값을 커서 월로 갱신
      const t = OT[n.id()]; if (t) n.data('label', focusLabel(t));
    }));
    if (window._refreshTwinData) window._refreshTwinData();          // 지도·보드도 커서 월 누적으로
  };
  // 임베드 재진입용 — 마지막 세션(드릴 경로·트윈 패널)을 버리고 해당 객체의 관계 뷰로 초기화.
  // id가 없으면(미선택) 전체 관계 뷰(온톨로지 그래프 전체 + 개요 패널)로 초기화한다.
  window._resetFocusView = id => {
    if (typeof closeTripMap === 'function') closeTripMap();
    document.getElementById('tabG').click();
    setSideMin(false);   // 접어둔 정보 패널도 초기 상태(펼침)로
    focusStack.length = 0;
    if (id && OT[id]) {
      pinnedId = id; hoverId = null; cancelClear();
      applyFocusMode(id);
      renderTypePanel(id);
    } else {
      unpin();               // 포커스 해제 + 그래프 전체 복원
      renderIntroPanel();
    }
    updateTools();
  };

  // ── 좌상단 도구바: 고정 시 [관계 뷰] 버튼, 포커스 중 [← 이전] + 경로 표시 ──
  const toolsEl = document.getElementById('graphTools');
  const btnFocus = document.getElementById('btnFocus');
  const btnBack = document.getElementById('btnBack');
  const crumbEl = document.getElementById('focusCrumb');
  function updateTools() {
    const showFocus = !focusOn && pinnedId && OT[pinnedId];
    btnFocus.style.display = showFocus ? '' : 'none';
    if (showFocus) btnFocus.textContent = `◎ ${OT[pinnedId].name} 관계 뷰로 보기`;
    btnBack.style.display = focusOn ? '' : 'none';
    crumbEl.style.display = focusOn ? '' : 'none';
    if (focusOn) crumbEl.textContent = [...focusStack, focusOn].map(i => OT[i].name).join(' › ');
    toolsEl.style.display = (showFocus || focusOn || window._twinTime) ? '' : 'none';
  }
  btnFocus.onclick = () => enterFocusView(pinnedId);
  btnBack.onclick = goBack;
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const tp = document.getElementById('twinPanel');
    if (tp.classList.contains('on')) { window.closeTripMap(); return; }   // 트윈 데이터 뷰 → 관계 뷰 복귀 우선
    if (!document.getElementById('viewG').classList.contains('on')) return;
    if (focusOn) goBack();
    else if (pinnedId) { unpin(); renderIntroPanel(); }
  });

  // 클릭 고정 — 객체 클릭 시 현재 하이라이트를 고정, 배경(비객체) 클릭 시 해제, 다른 객체 클릭 시 변경.
  // 관계 뷰 중의 객체 클릭은 드릴다운(포커스 이동)으로 처리한다.
  function pinFocus(id) {
    if (focusOn && OT[id]) { enterFocusView(id); return; }
    pinnedId = id; cancelClear(); hoverId = null;
    applyFocus(id);
    updateTools();
  }
  function unpin() {
    pinnedId = null; hoverId = null; cancelClear();
    if (focusOn) { focusStack.length = 0; exitFocus(true); }
    clearFocus();
    updateTools();
  }
  window._graphPin = pinFocus;   // 딥링크·객체 탐색 탭의 타입칩에서도 동일하게 고정
  function evaluateHover() {
    if (pinnedId) return;                     // 고정 중에는 호버 갱신 정지
    if (!ptr.inside || ptr.buttons) return;   // 밖이거나 드래그(노드 이동·팬) 중에는 동결
    const id = nodeAtClient(ptr.x, ptr.y);
    if (id === hoverId) {                     // 같은 객체 내부 이동(또는 계속 배경) → 유지
      if (id) cancelClear();
      return;
    }
    if (id) {                                 // 다른 객체로 진입 → 직행 전환
      cancelClear();
      hoverId = id;
      applyFocus(id);
    } else if (hoverId) scheduleClear();      // 배경 이동 — 매 이동마다 리셋(유휴 시에만 해제)
  }
  // 드래그 = 팬 (시작 지점 불문) — cytoscape 내장 팬은 "순수 배경"에서 시작한 드래그만
  // 처리해서 노드·엣지·투명 그룹 상자 위에서는 이동이 안 된다. 배경 시작은 내장 팬에 맡기고
  // (tapstart 타깃으로 식별), 그 외에서 시작한 드래그만 수동 panBy로 잇는다 — 이중 팬 없음.
  // 4px 임계값: 클릭(고정)의 미세한 흔들림이 팬으로 새지 않게.
  let dragPan = null;
  let cyOwnsPan = false;   // 이번 제스처를 내장 팬이 처리하는가 (배경에서 시작)
  cy.on('tapstart', e => { cyOwnsPan = e.target === cy; });
  cy.container().addEventListener('pointermove', evt => {
    ptr.x = evt.clientX; ptr.y = evt.clientY; ptr.inside = true; ptr.buttons = evt.buttons;
    if (dragPan && !cyOwnsPan && (evt.buttons & 1)) {
      const dx = evt.clientX - dragPan.x, dy = evt.clientY - dragPan.y;
      if (dragPan.on || Math.hypot(dx, dy) > 4) {
        dragPan.on = true;
        cy.panBy({ x: dx, y: dy });
        dragPan.x = evt.clientX; dragPan.y = evt.clientY;
      }
    }
    evaluateHover();
  });
  cy.container().addEventListener('pointerdown', evt => {
    ptr.buttons = evt.buttons;
    if (evt.button === 0) dragPan = { x: evt.clientX, y: evt.clientY, on: false };
  });
  cy.container().addEventListener('pointerup', evt => { ptr.buttons = evt.buttons; dragPan = null; evaluateHover(); });
  cy.container().addEventListener('mouseleave', () => {
    cancelClear(); ptr.inside = false; dragPan = null;
    if (pinnedId) return;                     // 고정 중에는 캔버스를 떠나도 유지 (패널을 읽는 동안 등)
    hoverId = null; clearFocus();
  });
  let hoverRaf = false;
  cy.on('zoom pan', () => {                   // 뷰포트 변화 → 다음 프레임에 1회 재판정
    if (hoverRaf) return;
    hoverRaf = true;
    requestAnimationFrame(() => { hoverRaf = false; evaluateHover(); });
  });
  // 탭도 동일한 사각형 판정 — 노드 박스 안 클릭이 겹친 엣지·배경으로 새지 않게.
  // 객체(노드·엣지) 클릭 = 하이라이트 고정, 배경·그룹 상자 클릭 = 해제.
  cy.on('tap', 'node[!isGroup]', e => { const id = e.target.id(); pinFocus(id); renderTypePanel(id); });
  cy.on('tap', 'edge', e => {
    const nid = e.renderedPosition && nodeAtRendered(e.renderedPosition);
    if (nid) { pinFocus(nid); renderTypePanel(nid); }
    else if (focusOn) renderLinkPanel(e.target.data('lt'));   // 포커스 유지한 채 링크 상세만
    else { pinFocus(e.target.id()); renderLinkPanel(e.target.data('lt')); }
  });
  cy.on('tap', e => {
    const t = e.target;
    if (t !== cy && !(t.isNode && t.isNode() && t.data('isGroup'))) return;   // 노드·엣지 탭은 위에서 처리
    const id = e.renderedPosition && nodeAtRendered(e.renderedPosition);
    if (id) { pinFocus(id); renderTypePanel(id); }
    else if (focusOn) goBack();                 // 관계 뷰 중 배경 클릭 = 한 단계 복귀 (ESC와 동일)
    else { unpin(); renderIntroPanel(); }
  });

})();

// ── 우측 패널: 초기(온톨로지 개요) ───────────────────────────────────────────
function renderIntroPanel() {
  const el = document.getElementById('sidePanel');
  // 설명문(개요·설계 원칙·사용법)은 기본 접힘 — 제목 클릭 시에만 펼쳐 확인
  el.innerHTML = `
    <h2>${esc(O.meta.name)}</h2>
    <div class="en">${esc(O.meta.id)} · v${O.meta.version} · ${O.meta.updated}</div>
    <details class="introDesc"><summary>ⓘ 설명 · 설계 원칙 · 사용법 — 클릭해서 펼치기</summary>
      <p class="desc">${esc(O.meta.description)}</p>
      <div class="card"><h3>설계 원칙</h3>
        ${O.meta.principles.map(p => `<div class="actrow" style="border:none;padding:3px 0">· ${esc(p)}</div>`).join('')}
      </div>
      <div class="hint">노드 = 객체 타입 (호버: 관계 하이라이트 · 클릭: 하이라이트 <b>고정</b> + 정의 상세 — 고정 중에는 줌/팬/호버에도 유지,
      배경 클릭/ESC = 해제 · 다른 객체 클릭 = 변경) · 엣지 = 링크 타입 · 휠 줌/드래그 팬.<br>
      객체를 고정하면 좌상단에 <b>[◎ 관계 뷰로 보기]</b> 버튼이 나타난다 — 링크된 타입만 방사형으로 펼치고
      각 객체를 아이콘 + 표본 인스턴스 + 주요 속성 카드로 보여주는 온톨로지 포커스 뷰.
      링크된 객체 클릭 = 드릴다운, <b>ESC / [← 이전] / 배경 클릭</b> = 역순 복귀.<br>
      선언 파일 하나(v7-ontology.js)가 이 화면·쿼리 바인딩·액션 카탈로그 전부의 원천이다.</div>
    </details>
    <div class="card"><h3>범례</h3>
      <div class="kv">
        ${O.groups.map(g => `<span><span class="gdot" style="background:${GC[g.id]}"></span>${esc(g.name)}</span>
          <span class="muted">${(O.objectTypes.filter(t => t.group === g.id)).length}개 타입</span>`).join('')}
      </div>
      <div style="margin-top:10px;font-size:11.5px;line-height:2">
        <span class="badge bound">BOUND</span> 마트 연결됨(실선) &nbsp;
        <span class="badge derived">DERIVED</span> 조인·역산 파생(이중선)<br>
        <span class="badge planned">PLANNED</span> 마트 신설 예정(파선 테두리)
      </div>
    </div>`;
}

// ── 우측 패널: 객체 타입 상세 ────────────────────────────────────────────────
function renderTypePanel(tid) {
  const t = OT[tid]; if (!t) return;
  const ds = t.datasource;
  const inL = O.linkTypes.filter(l => l.to === tid), outL = O.linkTypes.filter(l => l.from === tid);
  const acts = O.actionTypes.filter(a => a.objectType === tid);
  const el = document.getElementById('sidePanel');
  el.innerHTML = `
    <h2><span class="gdot" style="background:${GC[t.group]}"></span>${esc(t.name)}</h2>
    <div class="en">${esc(t.en)} · ${esc(O.groups.find(g => g.id === t.group).name)} · PK <span class="mono">${esc(t.primaryKey)}</span></div>
    <p class="desc">${esc(t.description)}</p>
    <div class="card"><h3>데이터 소스 <span class="badge ${ds.status}">${STATUS_KO[ds.status]}</span></h3>
      <div class="kv">
        <span class="k">경로</span><span class="mono" style="word-break:break-all">${esc(ds.path)}</span>
        <span class="k">그레인</span><span>${esc(ds.grain || '-')}</span>
        ${ds.note ? `<span class="k">비고</span><span class="muted">${esc(ds.note)}</span>` : ''}
      </div>
    </div>
    <div class="card"><h3>속성 ${t.properties.length}</h3>
      <table class="props"><tr><th>속성</th><th>타입</th><th>역할</th><th>샘플</th></tr>
      ${t.properties.map(p => `<tr>
        <td><b>${esc(p.name)}</b><br><span class="mono muted" style="font-size:10px">${esc(p.id)}</span></td>
        <td class="muted">${esc(p.type)}${p.unit ? ' · ' + esc(p.unit) : ''}</td>
        <td><span class="role ${p.role}">${esc(p.role)}</span></td>
        <td class="mono muted" style="font-size:10.5px">${esc(p.sample || '')}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card"><h3>링크 ${inL.length + outL.length}</h3>
      ${outL.map(l => `<div class="linkrow" onclick="renderLinkPanel('${l.id}')">
        <span class="lname">${esc(l.name)}</span><span class="dir">→ ${esc(OT[l.to].name)} (${l.card})</span></div>`).join('')}
      ${inL.map(l => `<div class="linkrow" onclick="renderLinkPanel('${l.id}')">
        <span class="lname">${esc(l.name)}</span><span class="dir">← ${esc(OT[l.from].name)} (${l.card})</span></div>`).join('')}
    </div>
    ${acts.length ? `<div class="card"><h3>액션 ${acts.length}</h3>
      ${acts.map(a => `<div class="actrow"><b>${esc(a.name)}</b> <span class="mono muted" style="font-size:10px">${esc(a.id)}</span>
        <div class="fx">효과: ${a.effects.map(esc).join(' · ')}</div>
        ${a.automation ? `<div class="fx" style="color:var(--st-derived)">⚙ 자동화 결과: ${esc(a.automation.output)}</div>` : ''}
        ${a.twinView ? `<button class="btn twinBtn" onclick="openTwinView('${a.id}')">◈ 디지털 트윈 — ${esc(a.twinView.label)}</button>` : ''}</div>`).join('')}</div>` : ''}
    ${t.lifecycleRef ? `<div class="card"><h3>수명주기</h3><div class="hint">${esc(O.lifecycles[t.lifecycleRef].name)} —
      상태 ${O.lifecycles[t.lifecycleRef].states.length}단계 · 게이트 검사 G1~G4. [액션 · 수명주기] 탭 참조.</div></div>` : ''}
    <button class="btn" onclick="window._enterFocus('${tid}')">◎ 관계 뷰로 보기 (링크 + 표본)</button>
    <button class="btn" onclick="gotoInstances('${tid}')">표본 인스턴스 ${cnt(tid)}건 보기 →</button>`;
}

// =============================================================================
// 탭2 — 객체 탐색 (인스턴스 → 링크 순회, 팔란티어 객체 뷰 스타일)
// =============================================================================
let curType = null, curKey = null, navStack = [];

(function buildTypeList() {
  const el = document.getElementById('typeList');
  let html = '';
  [...O.groups].sort((a, b) => a.order - b.order).forEach(g => {
    html += `<div class="grp">${esc(g.name)}</div>`;
    O.objectTypes.filter(t => t.group === g.id).forEach(t => {
      html += `<div class="trow" id="tr-${t.id}" onclick="selectType('${t.id}')">
        <span class="gdot" style="background:${GC[t.group]}"></span>${esc(t.name)}
        <span class="cnt">${cnt(t.id)}</span></div>`;
    });
  });
  el.innerHTML = html;
})();

function selectType(tid, keepSearch) {
  curType = tid;
  document.querySelectorAll('.trow').forEach(e => e.classList.toggle('on', e.id === 'tr-' + tid));
  const t = OT[tid];
  document.getElementById('listTitle').textContent = t.name;
  if (!keepSearch) document.getElementById('listSearch').value = '';
  renderInstList();
  const keys = filteredKeys();
  if (keys.length) renderObject(keys[0], true);
  else document.getElementById('objView').innerHTML =
    `<div class="hint" style="margin-top:20px">표본 인스턴스가 없습니다 — 데이터 소스 상태:
     <span class="badge ${t.datasource.status}">${STATUS_KO[t.datasource.status]}</span></div>`;
}
function filteredKeys() {
  const q = document.getElementById('listSearch').value.trim().toLowerCase();
  let keys = DB.byType[curType] || [];
  if (q) keys = keys.filter(k => { const o = DB.objects[k];
    return o.id.toLowerCase().includes(q) || o.title.toLowerCase().includes(q) ||
      Object.values(o.props).some(v => String(v).toLowerCase().includes(q)); });
  return keys;
}
function subtitleOf(o) {
  const t = OT[o.type];
  const dims = t.properties.filter(p => p.role === 'dim' || p.role === 'status').slice(0, 3);
  return dims.map(p => o.props[p.id]).filter(v => v !== undefined && v !== o.title).join(' · ');
}
function renderInstList() {
  const keys = filteredKeys();
  document.getElementById('listCount').textContent = ` ${keys.length}건 (표본)`;
  document.getElementById('instList').innerHTML = keys.slice(0, 400).map(k => {
    const o = DB.objects[k];
    return `<div class="irow ${k === curKey ? 'on' : ''}" id="ir-${cssId(k)}" onclick="renderObject('${k.replace(/'/g, "\\'")}')">
      <div class="t">${esc(o.title)}</div><div class="s">${esc(subtitleOf(o))}</div></div>`;
  }).join('');
}
const cssId = k => k.replace(/[^a-zA-Z0-9]/g, '_');
document.getElementById('listSearch').addEventListener('input', renderInstList);

function gotoInstances(tid) {
  document.getElementById('tabE').click();
  navStack = [];
  selectType(tid);
}

function renderObject(k, resetNav) {
  const o = DB.objects[k]; if (!o) return;
  if (resetNav) navStack = [];
  if (navStack[navStack.length - 1] !== k) navStack.push(k);
  if (navStack.length > 6) navStack.shift();
  curKey = k;
  if (o.type !== curType) { curType = o.type; selectTypeRowOnly(o.type); }
  renderInstList();
  const row = document.getElementById('ir-' + cssId(k)); if (row) row.scrollIntoView({ block: 'nearest' });

  const t = OT[o.type];
  // 링크 순회: out(이 객체 → 대상), in(다른 객체 → 이 객체)
  const outs = (DB.linksFrom[k] || []).map(l => ({ lt: LT[l.lt], other: DB.objects[l.to], dir: '→' }));
  const ins = (DB.linksTo[k] || []).map(l => ({ lt: LT[l.lt], other: DB.objects[l.from], dir: '←' }));
  const grouped = {};
  outs.concat(ins).forEach(x => {
    const gk = x.dir + x.lt.id;
    (grouped[gk] = grouped[gk] || { name: x.lt.name, dir: x.dir, items: [] }).items.push(x.other);
  });

  const crumbs = navStack.map((nk, i) => {
    const no = DB.objects[nk];
    return i === navStack.length - 1 ? `<b>${esc(no.title)}</b>`
      : `<a onclick="navTo(${i})">${esc(no.title)}</a>`;
  }).join(' <span class="muted">›</span> ');

  document.getElementById('objView').innerHTML = `
    <div class="crumbs">${crumbs}</div>
    <div class="objtitle">
      <h2>${esc(o.title)}</h2>
      <span class="typechip" style="color:${GC[t.group]};border-color:${GC[t.group]}"
        onclick="document.getElementById('tabG').click();window._cy.$('#${t.id}').select();window._graphPin('${t.id}');renderTypePanel('${t.id}')">${esc(t.name)}</span>
      <span class="badge ${t.datasource.status}">${STATUS_KO[t.datasource.status].split(' ·')[0]}</span>
    </div>
    <div class="muted" style="font-size:11.5px">PK <span class="mono">${esc(t.primaryKey)} = ${esc(o.id)}</span> ·
      소스 <span class="mono">${esc(t.datasource.path)}</span></div>
    ${o.type === 'vehicle' ? renderLifecycleStrip(k, o) : ''}
    <div class="section"><h3>속성</h3>
      <table class="props" style="max-width:640px"><tr><th>속성</th><th>값</th></tr>
      ${t.properties.map(p => o.props[p.id] === undefined ? '' :
        `<tr><td class="muted" style="width:170px">${esc(p.name)} <span class="mono" style="font-size:9.5px">${esc(p.id)}</span></td>
         <td><b>${esc(String(o.props[p.id]))}</b>${p.unit ? ` <span class="muted">${esc(p.unit)}</span>` : ''}</td></tr>`).join('')}
      </table>
    </div>
    <div class="section"><h3>연결된 객체 (${outs.length + ins.length})</h3>
      ${Object.values(grouped).map(g => `
        <div style="margin-bottom:9px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:3px">${g.dir === '→' ? '' : '← '}${esc(g.name)} <span class="mono">(${g.items.length})</span></div>
          <div class="chips">${g.items.slice(0, 24).map(it =>
            `<span class="chip" onclick="renderObject('${key2(it)}')"><span class="cty">${esc(OT[it.type].abbr)}</span>${esc(it.title)}</span>`).join('')}
          ${g.items.length > 24 ? `<span class="muted" style="font-size:11px">+${g.items.length - 24}</span>` : ''}</div>
        </div>`).join('') || '<div class="hint">연결 없음</div>'}
    </div>`;
}
const key2 = o => (o.type + ':' + o.id).replace(/'/g, "\\'");
function navTo(i) { const k = navStack[i]; navStack = navStack.slice(0, i); renderObject(k); }
function selectTypeRowOnly(tid) {
  document.querySelectorAll('.trow').forEach(e => e.classList.toggle('on', e.id === 'tr-' + tid));
  document.getElementById('listTitle').textContent = OT[tid].name;
}

// 차량 수명주기 스트립 — 게이트 검사 결과 연동
function renderLifecycleStrip(k, o) {
  const lc = O.lifecycles.vehicleLifecycle;
  const idx = lc.states.findIndex(s => s.id === o.props.state);
  const insps = (DB.linksTo[k] || []).filter(l => l.lt === 'inspectionOfVehicle').map(l => DB.objects[l.from]);
  let html = '<div class="lifecycle">';
  lc.states.forEach((s, i) => {
    const cls = i < idx ? 'done' : (i === idx ? 'now' : '');
    html += `<div class="lstate ${cls}"><div class="box">${esc(s.name)}<br><span class="mono" style="font-size:9px">${esc(s.id)}</span></div></div>`;
    if (i < lc.states.length - 1) {
      const tr = lc.transitions.find(t => t.from === s.id);
      const gate = tr && tr.gate;
      let gcls = '', gtxt = gate || '·';
      if (gate) {
        const ins = insps.find(x => x.props.gate.startsWith(gate));
        if (ins) { gcls = ins.props.result.includes('HOLD') ? 'hold' : 'pass'; gtxt = gate + ' ' + ins.props.result; }
        else if (i < idx) gcls = 'pass';
      }
      html += `<div class="lgate ${gcls}">${gate ? `<span class="g">${esc(gtxt)}</span>` : ''}
        <div class="arr">→</div>${tr && tr.gateName ? `<div class="gn">${esc(tr.gateName)}</div>` : ''}</div>`;
    }
  });
  html += '</div>';
  if (insps.length) html += `<div class="hint" style="margin-top:2px">검사 ${insps.length}건 기록 — PASS가 있어야 다음 단계로 전달 (연결된 객체의 품질 검사 참조)</div>`;
  return `<div class="section"><h3>수명주기 — ${esc(lc.name)}</h3>${html}</div>`;
}

        ${a.twinView ? `<button class="btn twinBtn" onclick="openTwinView('${a.id}')">◈ 디지털 트윈 — ${esc(a.twinView.label)}</button>` : ''}

    { t: '시멘틱 서빙', c: '#d55181', s: ['온톨로지 탐색기 (이 화면)', '객체 · 링크 · 액션 API', 'V7 전략 시뮬레이션', '액션 실행 → 마트 역기록'] },

  const W = 1180, BW = 196, BH = 138, GAPX = (W - 40 - 5 * BW) / 4, BY = 56;
  let svg = `<svg id="pipelineSvg" viewBox="0 0 ${W} 248" role="img" aria-label="parquet 마트에서 온톨로지까지 데이터 파이프라인">`;

  stages.forEach((st, i) => {
    const x = 20 + i * (BW + GAPX);
    svg += `<rect x="${x}" y="${BY}" width="${BW}" height="${BH}" rx="10" fill="var(--panel2)" stroke="${st.c}" stroke-width="1.6"/>
      <text x="${x + BW / 2}" y="${BY + 24}" text-anchor="middle" font-size="12" font-weight="700" fill="${st.c}">${esc(st.t)}</text>`;
    st.s.forEach((line, li) => {
      svg += `<text x="${x + 13}" y="${BY + 48 + li * 21}" font-size="10.5" fill="var(--text)">· ${esc(line)}</text>`;
    });
    if (i < 4) {
      const ax1 = x + BW, ax2 = x + BW + GAPX, ay = BY + BH / 2;

        <path d="M${ax2 - 7},${ay - 4} L${ax2},${ay} L${ax2 - 7},${ay + 4} Z" fill="#6e6e67"/>`;

    }
  });
  svg += `<text x="20" y="${BY + BH + 30}" font-size="10.5" fill="var(--muted)">재처리 = month 파티션 단위 replace(멱등) · 온톨로지 빌드는 물리 복제 없는 뷰라서 선언 변경이 재적재 없이 즉시 전파된다.</text></svg>`;

  // ── 바인딩 테이블: objectTypes.datasource에서 자동 생성 ──
  const gOrder = Object.fromEntries(O.groups.map(g => [g.id, g.order]));
  const rows = [...O.objectTypes].sort((a, b) => gOrder[a.group] - gOrder[b.group])
    .map(t => { const ds = t.datasource; return `<tr>
      <td><span class="gdot" style="background:${GC[t.group]}"></span><b>${esc(t.name)}</b>
        <span class="mono muted" style="font-size:10px">${esc(t.id)}</span></td>
      <td><span class="badge ${ds.status}">${esc(ds.status.toUpperCase())}</span></td>
      <td class="muted">${esc(ds.kind)}</td>
      <td class="mono" style="word-break:break-all">${esc(ds.path)}</td>
      <td class="muted">${esc(ds.grain || '-')}</td>
      <td class="mono">${esc(t.primaryKey)}</td></tr>`; }).join('');

  // ── 빌드 순서 DAG: linkTypes.fk 선언에서 위상 정렬로 도출 ──
  const deps = {}; O.objectTypes.forEach(t => deps[t.id] = new Set());
  let mediated = 0;
  O.linkTypes.forEach(l => {
    const owner = (l.fk || '').split('.')[0];
    if (owner === l.from && l.from !== l.to) deps[l.from].add(l.to);
    else if (owner === l.to && l.from !== l.to) deps[l.to].add(l.from);
    else mediated++;
  });
  const waves = []; const placed = new Set();
  let rest = O.objectTypes.map(t => t.id);
  while (rest.length) {
    const ready = rest.filter(id => [...deps[id]].every(d => placed.has(d)));
    if (!ready.length) { waves.push(rest); break; }
    waves.push(ready); ready.forEach(id => placed.add(id));
    rest = rest.filter(id => !placed.has(id));
  }
  const waveHtml = waves.map((w, i) => `<div class="wave">
    <span class="wno">WAVE ${i + 1}</span>
    <div class="chips">${w.map(id => `<span class="chip" style="cursor:default"><span class="gdot" style="background:${GC[OT[id].group]};width:7px;height:7px"></span>${esc(OT[id].name)}</span>`).join('')}</div>
  </div>`).join('');

  document.getElementById('pipelineWrap').innerHTML = `
    <h2>데이터 파이프라인 — 마트에서 온톨로지까지</h2>
    <div class="lead">데이터 엔지니어 관점의 변환 흐름. 핵심 원칙: <b style="color:var(--text)">온톨로지는 ETL 산출물이 아니라 마트 위의 뷰</b>다 —
      객체는 마트 테이블의 PK 승격, 링크는 fk 선언의 조인 구체화라서 그래프DB 등 별도 저장소로 복제하지 않는다.
      아래 바인딩 테이블과 빌드 순서는 v7-ontology.js 선언에서 화면이 직접 생성한 것으로, 선언과 문서가 어긋날 수 없다.</div>
    ${svg}

    <h2 style="margin-top:24px">① 마트 ↔ 객체 바인딩 — 선언 자동 생성 (bound ${stCnt.bound} · derived ${stCnt.derived} · planned ${stCnt.planned})</h2>
    <div class="lead">마트 신설 전에도 planned로 먼저 선언한다 — 파이프라인 백로그가 온톨로지 안에서 관리된다.</div>
    <table class="bind"><tr><th>객체 타입</th><th>상태</th><th>kind</th><th>마트 경로 (datasource.path)</th><th>그레인</th><th>PK</th></tr>${rows}</table>

    <h2 style="margin-top:24px">② 빌드 순서 — 링크 FK 선언에서 위상 정렬로 도출한 DAG</h2>
    <div class="lead">각 웨이브 안은 상호 의존이 없어 병렬 실행 가능. 새 링크를 선언하면 이 순서가 자동으로 다시 계산된다
      (fk가 매개 객체를 경유하는 링크 ${mediated}건은 양끝 객체 빌드 뒤 산출).</div>
    <div style="max-width:1180px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 16px">${waveHtml}</div>

    <h2 style="margin-top:24px">③ 증분 전략 · 품질 게이트</h2>
    <div class="stagegrid" style="grid-template-columns:repeat(auto-fill,minmax(480px,1fr))">
      <div class="stagecard"><h3>증분 전략 (멱등이 기본)</h3>
        <div class="actrow"><b>fact 마트</b><div class="fx">month=YYYY-MM 파티션 append. 지연 도착·정정은 해당 파티션 전체 replace — 상태 없는 재실행으로 백필 완결</div></div>
        <div class="actrow"><b>마스터(dim)</b><div class="fx">스냅샷 교체가 기본, 이력 필요 속성(딜러 등급 등)만 SCD2</div></div>
        <div class="actrow"><b>온톨로지</b><div class="fx">뷰라서 증분 개념 자체가 없음 — 마트 파티션이 publish되면 즉시 반영, 선언 변경도 재적재 없이 전파</div></div>
      </div>
      <div class="stagecard"><h3>품질 게이트 (실패 시 파티션 publish 차단)</h3>
        <div class="actrow"><b>PK 유일성 — ${O.objectTypes.length}건</b><div class="fx">objectType.primaryKey 선언에서 테스트 자동 생성 (dbt unique 상당)</div></div>
        <div class="actrow"><b>FK 고아 0건 — ${O.linkTypes.length - mediated}건</b><div class="fx">linkTypes.fk 선언에서 자동 생성 (dbt relationships 상당) — 고아 행은 격리 테이블로</div></div>
        <div class="actrow"><b>수명주기 합법성</b><div class="fx">vehicle.state 전이가 G1~G4 게이트 순서를 위반하지 않는지 — lifecycles 선언이 테스트 스펙</div></div>
        <div class="actrow"><b>derived 신선도</b><div class="fx">파생 객체(${stCnt.derived})가 입력 마트 최신 파티션보다 오래되면 재산출 트리거</div></div>
      </div>
    </div>

    <h2 style="margin-top:24px">④ DuckDB 변환 예시 — 선언 → SQL 기계 변환</h2>
    <pre class="code"><span class="c">-- 객체·링크·테스트 SQL은 전부 선언에서 생성 가능하다 (아래는 vehicle 1건 예시)</span>
<span class="c">-- ① 객체 뷰: 마트 → 객체. PK 승격, 컬럼명 = property.id 그대로 (매핑 계층 없음)</span>
<span class="k">CREATE OR REPLACE VIEW</span> ont_vehicle <span class="k">AS</span>
<span class="k">SELECT</span> vin <span class="k">AS</span> __pk, * <span class="k">FROM</span> read_parquet(<span style="color:var(--g-plan)">'mart/vehicle_master/month=*/*.parquet'</span>);

<span class="c">-- ② 링크 뷰: linkTypes.fk = 'vehicle.model_id' 선언 그대로 조인</span>
<span class="k">CREATE OR REPLACE VIEW</span> lnk_vehicle_model <span class="k">AS</span>
<span class="k">SELECT</span> v.__pk <span class="k">AS</span> from_pk, m.model_id <span class="k">AS</span> to_pk
<span class="k">FROM</span> ont_vehicle v <span class="k">JOIN</span> ont_model m <span class="k">ON</span> v.model_id = m.model_id;

<span class="c">-- ③ 품질 게이트: 고아 FK가 0이어야 해당 month 파티션 publish</span>
<span class="k">SELECT</span> count(*) <span class="k">AS</span> orphans
<span class="k">FROM</span> ont_vehicle v <span class="k">LEFT JOIN</span> ont_model m <span class="k">ON</span> v.model_id = m.model_id
<span class="k">WHERE</span> m.model_id <span class="k">IS NULL</span>;  <span class="c">-- 0 초과면 차단 + 고아 행 격리</span></pre>`;
})();

// =============================================================================
// 텔레매틱스 Trip 지도 — recordDrivingTrip 액션의 "디지털 트윈 데이터 뷰"
//  베이스맵: Carto 벡터 GL 스타일(OSM 데이터) — 오프라인이면 다크 배경 폴백
//  데이터: 표본 telematicsEvent(data_category=trip)의 도착지 GPS → H3 r7 셀 집계
// =============================================================================
// =============================================================================
// 디지털 트윈 데이터 뷰 — 관계 뷰 영역 전체를 덮는 오버레이 (Y축 길이 = 관계 뷰와 동일)
//  · 액션의 twinView 선언(kind: map/board = 데이터 뷰, sim = 전략 트윈 복귀)
//  · 같은 객체에 데이터 뷰 액션이 2개 이상이면 드롭다운으로 즉시 전환
//  · 닫기는 [▲ 관계 뷰로] 단일 컨트롤 — 관계 뷰와의 연결성 유지 (ESC 동일)
// =============================================================================
const twinPanel = document.getElementById('twinPanel');
const twSelect = document.getElementById('twSelect');
let twCurrent = null;   // 표시 중인 트윈 뷰 액션 id
const dataViewsOf = tid =>
  O.actionTypes.filter(a => a.objectType === tid && a.twinView && a.twinView.kind !== 'sim');
function openTwinView(actionId) {
  const a = O.actionTypes.find(x => x.id === actionId);
  if (!a || !a.twinView) return;
  if (a.twinView.kind !== 'sim') { openTwinPanel(actionId); return; }
  // sim: v8 오버레이(임베드) 안이면 새 창 없이 실행 중인 트윈으로 복귀
  try {
    if (window.parent !== window && typeof window.parent.closeOntology === 'function') {
      window.parent.closeOntology();
      return;
    }
  } catch (e) { /* cross-origin 등 — 새 창 폴백 */ }
  window.open('v8-strategy-sim-twin.html#noBrief', '_blank');
}
async function openTwinPanel(actionId) {
  const a = O.actionTypes.find(x => x.id === actionId);
  const views = dataViewsOf(a.objectType);
  twSelect.innerHTML = views.map(v =>
    `<option value="${v.id}"${v.id === actionId ? ' selected' : ''}>${esc(v.name)} — ${esc(v.twinView.label)}</option>`).join('');
  twSelect.style.display = views.length > 1 ? '' : 'none';
  document.getElementById('twObj').textContent =
    `${OT[a.objectType].name}${views.length > 1 ? ` · 트윈 뷰 ${views.length}개` : ` — ${a.name}`}`;
  twinPanel.classList.add('on');
  window._cy && window._cy.resize();
  await showTwinView(actionId);
}
twSelect.onchange = () => showTwinView(twSelect.value);
async function showTwinView(actionId) {
  twCurrent = actionId;
  const a = O.actionTypes.find(x => x.id === actionId);
  document.querySelectorAll('.twView').forEach(e => e.classList.remove('on'));
  if (a.twinView.kind === 'map') {
    document.getElementById('tripMap').classList.add('on');
    await initTripMap();
    window._updateTripTime && window._updateTripTime();   // 현재 Play 커서 월 반영
    window._tripMap && window._tripMap.map.resize();
  } else {
    document.getElementById('dtcBoard').classList.add('on');
    renderDtcBoard();
  }
  window._twinPanel = { open: true, action: actionId, views: [...twSelect.options].map(o => o.value) };
}
function closeTwinPanel() {
  twinPanel.classList.remove('on');
  window._twinPanel = { open: false };
  window._cy && window._cy.resize();
}
// Play 커서(월) 변경 → 열려 있는 트윈 데이터 뷰를 해당 월 누적으로 갱신
window._refreshTwinData = () => {
  if (!twinPanel.classList.contains('on') || !twCurrent) return;
  const a = O.actionTypes.find(x => x.id === twCurrent);
  if (!a || !a.twinView) return;
  if (a.twinView.kind === 'map') { if (window._updateTripTime) window._updateTripTime(); }
  else renderDtcBoard();
};
document.getElementById('twClose').onclick = closeTwinPanel;
// 하위 호환 별칭 (v8·기존 경로)
function openTripMap() { return openTwinPanel('recordDrivingTrip'); }
function closeTripMap() { closeTwinPanel(); }

// ── 데이터 뷰 2: DTC 신호 보드 — 텔레매틱스 이상 신호(data_category=dtc) 트리아지 현황 ──
function renderDtcBoard() {
  const tc = window._twinTime;   // Play 커서 월까지 누적 (v8 연동)
  const evs = DB.order.map(k => DB.objects[k])
    .filter(o => o.type === 'telematicsEvent' && o.props.data_category === 'dtc'
      && (!tc || o.props.ts.slice(0, 7) <= tc.ym))
    .map(o => o.props)
    .sort((a, b) => (a.severity === 'SAFETY' ? -1 : 1) - (b.severity === 'SAFETY' ? -1 : 1));
  const sev = {}; evs.forEach(e => sev[e.severity] = (sev[e.severity] || 0) + 1);
  const SEV_C = { SAFETY: 'var(--safety)', HIGH: '#d95926', MEDIUM: 'var(--st-planned)', LOW: 'var(--muted)' };
  const mx = Math.max(1, ...Object.values(sev));
  document.getElementById('dtcBoard').innerHTML = `
    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
      <div class="card" style="min-width:250px">
        <h3>심각도 분포 — 표본 ${evs.length}건${tc ? ` · ⏱ ${tc.ym}까지 누적${tc.sim ? ' (실측은 현재월까지)' : ''}` : ''}</h3>
        ${Object.entries(sev).map(([s, n]) => `
          <div style="display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0">
            <span style="width:64px;font-weight:700;color:${SEV_C[s] || 'var(--text)'}">${esc(s)}</span>
            <div style="flex:1;height:9px;background:var(--panel3);border-radius:4px"><div style="width:${n / mx * 100}%;height:100%;background:${SEV_C[s] || 'var(--edge-hi)'};border-radius:4px"></div></div>
            <b style="width:30px;text-align:right">${n}</b>
          </div>`).join('')}
        <div class="hint" style="margin-top:8px">SAFETY = 즉시 안전 대응 · 패턴 신호는 품질 이슈 후보로 클러스터링 (triageTelematicsSignal 액션의 결과 뷰)</div>
      </div>
      <div class="card" style="flex:1;min-width:420px">
        <h3>신호 목록 — 트리아지 상태</h3>
        <table class="props"><tr><th>이벤트</th><th>VIN</th><th>DTC</th><th>심각도</th><th>트리아지</th><th>발생</th></tr>
        ${evs.map(e => `<tr>
          <td class="mono" style="font-size:10px">${esc(e.event_id)}</td>
          <td class="mono" style="font-size:10px">${esc(e.vin.slice(-8))}</td>
          <td class="mono">${esc(e.dtc_code)}</td>
          <td style="color:${SEV_C[e.severity] || 'var(--text)'};font-weight:700">${esc(e.severity)}</td>
          <td class="muted">${esc(e.triage_status)}</td>
          <td class="muted mono" style="font-size:10px">${esc(e.ts.slice(0, 10))}</td></tr>`).join('')}
        </table>
      </div>
    </div>`;
}

// ── 데이터 뷰 1: Trip 지도 (지연 초기화 1회) ─────────────────────────────────
let _tripMapReady = null;
async function initTripMap() {
  if (_tripMapReady) return _tripMapReady;
  _tripMapReady = (async () => {
    // h3-js (UMD) + maplibre css 로드
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'vendor/h3-js.umd.js'; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'vendor/maplibre-gl.css';
    document.head.appendChild(css);
    const ml = await import('./vendor/maplibre-gl.mjs');
    const maplibregl = ml.default ?? ml;   // v6 ESM은 named export만 제공

    // Trip 이벤트 → H3 r7 셀 집계 (도착지 GPS 기준) — Play 커서 월까지 '누적'으로 필터
    const allTrips = DB.order.map(k => DB.objects[k])
      .filter(o => o.type === 'telematicsEvent' && o.props.data_category === 'trip')
      .map(o => o.props);
    const maxN = (() => {   // 색·크기 스케일은 전체 데이터 기준으로 고정 — 시간 이동에도 일관
      const c = {};
      allTrips.forEach(p => { const k = h3.latLngToCell(p.dest_lat, p.dest_lon, 7); c[k] = (c[k] || 0) + 1; });
      return Math.max(1, ...Object.values(c));
    })();
    const buildData = ymLimit => {
      const trips = ymLimit ? allTrips.filter(p => p.ts.slice(0, 7) <= ymLimit) : allTrips;
      const cells = {};
      trips.forEach(p => {
        const c = h3.latLngToCell(p.dest_lat, p.dest_lon, 7);
        (cells[c] = cells[c] || { n: 0, km: 0, vins: new Set() });
        cells[c].n++; cells[c].km += p.trip_km; cells[c].vins.add(p.vin);
      });
      const hexFC = { type: 'FeatureCollection', features: Object.entries(cells).map(([c, v]) => ({
        type: 'Feature',
        properties: { h3: c, trips: v.n, km: +v.km.toFixed(1), vins: v.vins.size, w: v.n / maxN },
        geometry: { type: 'Polygon', coordinates: [h3.cellToBoundary(c, true)] },
      })) };
      const ptFC = { type: 'FeatureCollection', features: hexFC.features.map(f => {
        const [lat, lng] = h3.cellToLatLng(f.properties.h3);
        return { type: 'Feature', properties: f.properties, geometry: { type: 'Point', coordinates: [lng, lat] } };
      }) };
      return { trips, hexFC, ptFC };
    };
    const setStats = d => {
      const tc = window._twinTime;
      document.getElementById('tmStats').textContent =
        `trip ${d.trips.length.toLocaleString()}건 · H3 셀 ${d.hexFC.features.length}개` +
        (tc ? ` · ⏱ ${tc.ym}까지 누적${tc.sim ? ' (실측은 현재월까지)' : ''}` : ' · 표본 인스턴스 기준');
    };
    const first = buildData(window._twinTime ? window._twinTime.ym : null);
    setStats(first);
    // 데이터 전체가 항상 화면에 들어오게 fitBounds — 고정 center/zoom은 짧은 패널에서 잘려 보인다
    const BOUNDS = (() => {
      let w = 180, s = 90, e = -180, n = -90;
      allTrips.forEach(p => { w = Math.min(w, p.dest_lon); e = Math.max(e, p.dest_lon);
        s = Math.min(s, p.dest_lat); n = Math.max(n, p.dest_lat); });
      return [[w - 2, s - 2], [e + 2, n + 2]];
    })();

    // 베이스맵 — Carto 벡터 스타일 시도, 실패 시 다크 폴백 (오프라인)
    let style = {
      version: 8, sources: {},
      layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#11151c' } }],
    };
    try {
      const r = await fetch('https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json',
        { signal: AbortSignal.timeout(5000) });
      if (r.ok) style = await r.json();
      else document.getElementById('tmStats').textContent += ' · 베이스맵 오프라인(폴백)';
    } catch { document.getElementById('tmStats').textContent += ' · 베이스맵 오프라인(폴백)'; }

    const map = new maplibregl.Map({
      container: 'tripMap', style, bounds: BOUNDS, fitBoundsOptions: { padding: 30 },
      attributionControl: { compact: false },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    await new Promise(res => map.on('load', res));
    // 셀 중심점 소스 — 전국 줌에서는 r7 헥사곤(~1km)이 서브픽셀이라 서클로 표기하고,
    // 줌 7.5 이상으로 확대하면 실제 H3 경계 폴리곤이 나타난다 (줌 적응형)
    map.addSource('trip-hex', { type: 'geojson', data: first.hexFC });
    map.addSource('trip-pts', { type: 'geojson', data: first.ptFC });
    // 농도 = Trip 수 — 주행이 많은 셀일수록 밝고 크게 (도메인은 실제 최대 카운트 기준 동적)
    const RAMP = ['interpolate', ['linear'], ['get', 'w'], 0, '#16406f', 0.4, '#2f81f7', 1, '#b9dcff'];
    map.addLayer({ id: 'hex-dot', type: 'circle', source: 'trip-pts', maxzoom: 7.5, paint: {
      'circle-color': RAMP,
      'circle-opacity': ['interpolate', ['linear'], ['get', 'w'], 0, 0.45, 1, 0.95],
      'circle-radius': ['interpolate', ['linear'], ['get', 'trips'], 1, 4.5, Math.max(2, maxN), 16],
      'circle-stroke-color': '#cfe6ff',
      'circle-stroke-width': ['interpolate', ['linear'], ['get', 'w'], 0, 0.4, 1, 1.6] } });
    map.addLayer({ id: 'hex-fill', type: 'fill', source: 'trip-hex', minzoom: 7.5, paint: {
      'fill-color': RAMP,
      'fill-opacity': ['interpolate', ['linear'], ['get', 'w'], 0, 0.4, 1, 0.88],
    } });
    map.addLayer({ id: 'hex-line', type: 'line', source: 'trip-hex', minzoom: 7.5, paint: {
      'line-color': CV('--edge-hi'), 'line-width': 0.8, 'line-opacity': 0.8 } });
    map.on('click', 'hex-dot', e => {
      map.easeTo({ center: e.lngLat, zoom: 9.2, duration: 700 });   // 서클 클릭 = 셀 상세로 줌
    });
    map.on('click', 'hex-fill', e => {
      const p = e.features[0].properties;
      new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat)
        .setHTML(`<div>H3 <code>${p.h3}</code><br>` +   // 글꼴·색은 #twBody 팝업 오버라이드(디자인 토큰)로 통일
          `Trip <b>${p.trips}</b>건 · 차량 ${p.vins}대 · 누적 ${p.km}km</div>`)
        .addTo(map);
    });
    map.on('mouseenter', 'hex-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'hex-fill', () => map.getCanvas().style.cursor = '');
    window._tripMap = { map, cells: first.hexFC.features.length, trips: first.trips.length, maxN, bounds: BOUNDS };
    const fitTrips = () => map.fitBounds(BOUNDS, { padding: 30, duration: 0, maxZoom: 8 });
    // Play 커서 월 변경 → 누적 데이터 갱신 (v8 _setTwinTime 경유)
    window._updateTripTime = () => {
      const d = buildData(window._twinTime ? window._twinTime.ym : null);
      map.getSource('trip-hex').setData(d.hexFC);
      map.getSource('trip-pts').setData(d.ptFC);
      window._tripMap.trips = d.trips.length;
      window._tripMap.cells = d.hexFC.features.length;
      setStats(d);
    };
    // 컨테이너 크기 변화(패널 개폐·임베드 iframe 리사이즈·창 크기) → 캔버스 리사이즈 + 재-fit
    // (절반 렌더/잘림 방지 — 데이터 전체가 항상 보이게)
    new ResizeObserver(() => { map.resize(); fitTrips(); }).observe(document.getElementById('tripMap'));
    requestAnimationFrame(() => { map.resize(); fitTrips(); });
    return map;
  })();
  return _tripMapReady;
}

// URL 해시 딥링크 — '#<tid>' = 고정, '#focus:<tid>' = 관계 뷰 진입,
// '#act:<actionId>' = 대상 객체 관계 뷰 + (map/board 트윈 뷰가 있으면) 데이터 뷰까지 오픈.
// V10 트윈 월드가 임베드 iframe의 해시만 바꿔 재소환하므로 hashchange에도 다시 적용한다.
// 베일 On/Off — 상태 적용이 끝난 프레임 이후에만 걷어서 이전/기본 제목줄이 보이지 않게 한다.
const dlVeil = document.getElementById('dlVeil');
function dlVeilOn() { dlVeil.hidden = false; dlVeil.classList.remove('off'); }
function dlVeilOff() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    dlVeil.classList.add('off');
    setTimeout(() => { dlVeil.hidden = true; }, 250);
  }));
}
function applyHashDeepLink() {
  try {
    if (location.hash.length <= 1) return;
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('act:')) {
      const a = O.actionTypes.find(x => x.id === h.slice(4));
      if (!a || !OT[a.objectType]) return;
      window._resetFocusView(a.objectType);                       // 액션 대상 객체의 관계 뷰로 초기화
      if (a.twinView && a.twinView.kind !== 'sim') openTwinPanel(a.id);   // 데이터 뷰 액션이면 바로 오픈
      return;
    }
    const focus = h.startsWith('focus:');
    const tid = focus ? h.slice(6) : h;
    if (OT[tid]) {
      if (focus) { window._resetFocusView(tid); return; }
      window._cy.$('#' + tid).select();
      window._graphPin(tid);
      renderTypePanel(tid);
    }
  } finally { dlVeilOff(); }   // 어떤 경로로 끝나도 베일은 걷는다
}
applyHashDeepLink();
// 재소환(같은 문서, 해시만 변경)도 베일을 먼저 덮고 적용 — 이전 제목줄 플래시 방지
window.addEventListener('hashchange', () => { dlVeilOn(); applyHashDeepLink(); });
</script>
</body>
