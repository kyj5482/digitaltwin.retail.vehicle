<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계층형 시스템 트윈 — V4 · 판매법인 디지털 트윈</title>
<style>
/* ============ 토큰 (dataviz 레퍼런스 팔레트) ============ */
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1a1a19; --page:#0d0d0d;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --hairline:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up-good:#0ca30c;
  --seq1:#cde2fb; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --obj:#232322; --obj-edge:#3a3a37; --obj-hi:#2c2c2a;
  --flow-mat:#4a4a46; --flow-data:#3f3f3c;
}
:root[data-theme="light"]{
  color-scheme: light;
  --surface:#fcfcfb; --page:#f9f9f7;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --hairline:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up-good:#006300;
  --seq1:#cde2fb; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --obj:#f2f1ee; --obj-edge:#d8d7d0; --obj-hi:#e9e8e3;
  --flow-mat:#c9c8c1; --flow-data:#d4d3cc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink); font-size:13px;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ 헤더 ============ */
header{
  display:flex;align-items:center;gap:12px;padding:8px 16px;
  border-bottom:1px solid var(--hairline);background:var(--surface);flex:none;
}
header h1{font-size:15px;font-weight:600}
header .sub{color:var(--muted);font-size:12px}
.mode-badge{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--hairline);color:var(--ink2)}
.mode-badge.sim{color:var(--s2);border-color:var(--s2)}
#themeBtn{margin-left:auto;border:1px solid var(--hairline);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink2)}
#themeBtn:hover{background:var(--obj-hi)}

/* ============ KPI 타일 ============ */
#kpiRow{display:flex;gap:8px;padding:8px 16px;background:var(--page);flex:none}
.kpi{
  flex:1;background:var(--surface);border:1px solid var(--hairline);border-radius:8px;
  padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;
}
.kpi .lbl{font-size:11px;color:var(--muted)}
.kpi .row{display:flex;align-items:baseline;gap:8px}
.kpi .val{font-size:19px;font-weight:600}
.kpi .delta{font-size:11px;color:var(--ink2)}
.kpi .delta.good{color:var(--up-good)}
.kpi .delta.bad{color:var(--crit)}
.kpi svg{margin-top:2px}

/* ============ 알림 스트립 ============ */
#alertStrip{display:flex;gap:8px;padding:0 16px 6px;flex-wrap:wrap;flex:none;min-height:24px}
.alert-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);
  border:1px solid var(--hairline);border-radius:12px;padding:3px 10px;background:var(--surface);
}
.alert-chip .ic{font-size:11px}
.alert-chip.warn .ic{color:var(--warn)} .alert-chip.crit .ic{color:var(--crit)}
.alert-chip.serious .ic{color:var(--serious)} .alert-chip.good .ic{color:var(--good)}
.alert-chip b{font-weight:600;color:var(--ink)}

/* ============ 브레드크럼 ============ */
#crumbBar{display:flex;align-items:center;gap:6px;padding:4px 16px;flex:none;font-size:12px}
#crumbBar .crumb{color:var(--ink2);padding:3px 8px;border-radius:6px}
#crumbBar .crumb.link{color:var(--s1);cursor:pointer}
#crumbBar .crumb.link:hover{background:var(--obj-hi)}
#crumbBar .sep{color:var(--muted)}
#crumbBar .hint{margin-left:auto;color:var(--muted);font-size:11px}

/* ============ 씬 ============ */
#main{flex:1;display:flex;min-height:0;position:relative}
#sceneWrap{flex:1;position:relative;background:var(--page);min-width:0}
#sceneSvg{width:100%;height:100%;display:block}
#sceneSvg text{font-family:inherit}
.obj-box{fill:var(--obj);stroke:var(--obj-edge);stroke-width:1;rx:10}
.obj-box.click{cursor:pointer}
.obj-inner{fill:var(--obj-hi);stroke:var(--obj-edge);stroke-width:.5}
.obj-title{fill:var(--ink);font-size:12px;font-weight:600}
.obj-sub{fill:var(--muted);font-size:10px}
.obj-num{fill:var(--ink);font-size:15px;font-weight:600}
.obj-num.small{font-size:12px}
.obj-lbl{fill:var(--ink2);font-size:10px}
.lamp-lbl{fill:var(--ink2);font-size:9.5px}
.flow-mat{stroke:var(--flow-mat);fill:none;stroke-linecap:round}
.flow-data{stroke:var(--flow-data);fill:none;stroke-dasharray:3 5;stroke-linecap:round}
.badge-bg{fill:var(--surface);stroke:var(--hairline)}
.badge-txt{fill:var(--ink2);font-size:9.5px}
.p-mat{fill:var(--s1)} .p-data{fill:var(--s3)} .p-cmd{fill:var(--s2)}
.gauge-track{fill:var(--grid)}
.hatch{stroke:var(--crit);stroke-width:1;opacity:.55}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.obj-hover:hover .obj-box{stroke:var(--s1);stroke-width:1.4}
.scene-enter{animation:sceneIn .34s ease-out}
@keyframes sceneIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .pulse,.blink,.scene-enter{animation:none !important}
}

/* ============ 우측 패널 ============ */
#sidePanel{
  position:absolute;top:0;right:0;bottom:0;width:370px;max-width:85%;
  background:var(--surface);border-left:1px solid var(--hairline);
  transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:30;
}
#sidePanel.open{transform:translateX(0)}
@media (prefers-reduced-motion: reduce){#sidePanel{transition:none}}
#panelHead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hairline);flex:none}
#panelTitle{font-size:13px;font-weight:600}
#panelClose{margin-left:auto;color:var(--muted);font-size:15px;padding:2px 8px;border-radius:6px}
#panelClose:hover{background:var(--obj-hi)}
#panelBody{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.pnl-sec h3{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.pnl-table{width:100%;border-collapse:collapse;font-size:12px}
.pnl-table th{font-size:10.5px;color:var(--muted);text-align:left;font-weight:500;padding:3px 6px;border-bottom:1px solid var(--grid)}
.pnl-table td{padding:4px 6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.pnl-table td.num{text-align:right}
.pnl-table tr.rowlink{cursor:pointer}
.pnl-table tr.rowlink:hover{background:var(--obj-hi)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.pnl-btn{border:1px solid var(--hairline);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--s1)}
.pnl-btn:hover{background:var(--obj-hi)}
.vin-chain{display:flex;flex-direction:column;gap:0;margin-top:4px}
.vc-step{display:flex;gap:10px;position:relative;padding:0 0 14px 18px}
.vc-step::before{content:"";position:absolute;left:5px;top:5px;bottom:-2px;width:2px;background:var(--grid)}
.vc-step:last-child::before{display:none}
.vc-step::after{content:"";position:absolute;left:1px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--s1);border:2px solid var(--surface)}
.vc-step.evt-svc::after{background:var(--s5)}
.vc-stage{font-weight:600;font-size:12px}
.vc-meta{color:var(--muted);font-size:11px}
.back-note{color:var(--muted);font-size:11px}

/* ============ 툴팁 ============ */
#tooltip{
  position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--hairline);
  border-radius:6px;padding:7px 10px;font-size:11.5px;z-index:99;display:none;max-width:260px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
#tooltip .tt-title{font-weight:600;margin-bottom:3px}
#tooltip .tt-row{display:flex;gap:8px;align-items:center;color:var(--ink2)}
#tooltip .tt-row b{color:var(--ink);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.tt-key{display:inline-block;width:12px;height:0;border-top:2px solid var(--muted)}

/* ============ 타임라인 바 ============ */
#timeline{
  flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:var(--surface);border-top:1px solid var(--hairline);
}
#tlPlay{width:32px;height:32px;border:1px solid var(--hairline);border-radius:50%;font-size:13px;color:var(--ink)}
#tlPlay:hover{background:var(--obj-hi)}
#tlSpeed{border:1px solid var(--hairline);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--ink2)}
#tlSpeed:hover{background:var(--obj-hi)}
#tlCur{font-size:14px;font-weight:600;min-width:130px}
#tlCur .tag{font-size:10px;font-weight:500;color:var(--ink2);border:1px solid var(--hairline);padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:2px}
#tlCur .tag.sim{color:var(--s2);border-color:var(--s2)}
#tlTrack{flex:1;position:relative;height:26px;display:flex;align-items:center}
#tlSlider{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--grid);outline:none}
#tlSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--s1);cursor:pointer;border:2px solid var(--surface)}
#tlSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--s1);cursor:pointer;border:2px solid var(--surface)}
#tlBoundary{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--baseline);pointer-events:none}
#tlBoundary::after{content:"실적 │ 시뮬레이션";position:absolute;top:-13px;left:-38px;font-size:9.5px;color:var(--muted);white-space:nowrap}
#tlEnds{position:absolute;top:20px;left:0;right:0;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>계층형 시스템 트윈 <span class="sub">V4 · System of Systems</span></h1>
  <span class="mode-badge" id="modeBadge">실적</span>
  <button id="themeBtn" type="button">라이트 모드</button>
</header>

<div id="kpiRow"></div>
<div id="alertStrip"></div>
<div id="crumbBar"></div>

<div id="main">
  <div id="sceneWrap"><svg id="sceneSvg" viewBox="0 0 1240 640" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside id="sidePanel" aria-hidden="true">
    <div id="panelHead"><span id="panelTitle"></span><button id="panelClose" type="button" aria-label="닫기">✕</button></div>
    <div id="panelBody"></div>
  </aside>
</div>

<div id="timeline">
  <button id="tlPlay" type="button" aria-label="재생">▶</button>
  <button id="tlSpeed" type="button">1×</button>
  <span id="tlCur"></span>
  <div id="tlTrack">
    <input id="tlSlider" type="range" min="0" max="47" value="31" step="1" aria-label="월 선택">
    <div id="tlBoundary"></div>
    <div id="tlEnds"><span>2024-01</span><span>2027-12</span></div>
  </div>
</div>

<div id="tooltip" role="tooltip"></div>

<script>
"use strict";
/* ===== DATA ===== */
/* 시드 고정 난수 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---- 비즈니스 상수 ---- */
const N_MONTHS=48, NOW_IDX=31; /* 2024-01 ~ 2027-12, NOW=2026-08 */
const MONTHS=(()=>{const a=[];for(let i=0;i<48;i++){const y=2024+Math.floor(i/12),m=i%12+1;a.push({idx:i,ym:y+"-"+String(m).padStart(2,"0"),y,m,sim:i>NOW_IDX})}return a})();
const MODELS=[
 {id:"Aurora", seg:"EV 크로스오버", trims:["SE","XLE","GT"], plant:"KR-UL", share:.18, slot:1},
 {id:"Meridian",seg:"중형 SUV",     trims:["LE","XLE","Trail"],plant:"US-AL", share:.32, slot:2},
 {id:"Vista",  seg:"중형 세단",     trims:["SE","XSE","Hybrid"],plant:"MX-MT",share:.22, slot:3},
 {id:"Terron", seg:"픽업",          trims:["Work","Sport","Pro"],plant:"US-AL",share:.28, slot:4},
];
const PLANTS={
 "US-AL":{name:"생산법인 US-AL",loc:"Montgomery, Alabama",modes:["트럭","철도"],mainMode:"트럭",lead:"~2주",cap:26000,wmi:"1AD",batch:{mode:"철도 편성",size:120},shipW:[0.5,0.5]},
 "KR-UL":{name:"생산법인 KR-UL",loc:"울산, 대한민국",modes:["선박","철도"],mainMode:"선박",lead:"~5–6주",cap:9500,wmi:"KLA",batch:{mode:"선박 배치",size:800},shipW:[0,0.3,0.7]},
 "MX-MT":{name:"생산법인 MX-MT",loc:"Monterrey, Mexico",modes:["철도","트럭"],mainMode:"철도",lead:"~3주",cap:10500,wmi:"3MD",batch:{mode:"철도 편성",size:120},shipW:[0.2,0.8]},
};
const PLANT_IDS=["US-AL","KR-UL","MX-MT"];
const REGIONS=[
 {id:"West",w:.14},{id:"Southwest",w:.09},{id:"Mountain",w:.06},{id:"Central",w:.09},{id:"South",w:.12},
 {id:"Southeast",w:.11},{id:"Great Lakes",w:.13},{id:"Northeast",w:.08},{id:"Mid-Atlantic",w:.10},{id:"Florida",w:.08},
];
const CHANNELS=[{id:"Retail",w:.78},{id:"Fleet",w:.12},{id:"Government",w:.04},{id:"Rental",w:.06}];
const SEASON=[0.90,0.92,1.18,1.00,1.02,1.04,0.98,1.16,1.00,0.97,0.95,1.18]; /* 3·8·12월 성수기 */
const BP_YEAR={2024:400000,2025:410000,2026:420000,2027:450000};
const EVT_KRUL=[18,19];           /* 2025-07~08 KR-UL 설비 이상 */
const EVT_CAMP_START=26;          /* 2026-03 Aurora 품질 캠페인 */
const CAMP_CSI=[-3.5,-5.5,-4.5,-3.0,-1.5,-0.5];
const MARGIN=3400, INCENTIVE=1200, FREIGHT={"US-AL":420,"KR-UL":1780,"MX-MT":880};
const DS_TARGET=60;

/* ---- 월별 집계 생성 (순수 함수) ---- */
function buildData(){
  const rnd=mulberry32(20260820);
  const noise=(amp)=>1+(rnd()*2-1)*amp;
  const byMonth=[];
  /* 상태 */
  const dealerStock={},backlog={},prodHist={};
  MODELS.forEach(md=>{dealerStock[md.id]=md.share*35000*2.0;backlog[md.id]=0;prodHist[md.id]=[]});
  let uio=1250000;
  const retailHist={}; MODELS.forEach(md=>retailHist[md.id]=[]);

  for(let i=0;i<N_MONTHS;i++){
    const mo=MONTHS[i], season=SEASON[mo.m-1];
    const growth=Math.pow(1.0028,i);
    const rec={idx:i,ym:mo.ym,sim:mo.sim,retail:{},orders:{},prod:{},arriv:{},retailTotal:0,ordersTotal:0,prodByPlant:{},alerts:[]};

    /* 수요(Retail) */
    MODELS.forEach(md=>{
      let d=35000*md.share*season*growth*noise(.05);
      if(md.id==="Aurora"&&i>=EVT_CAMP_START&&i<EVT_CAMP_START+3) d*=.93; /* 캠페인 수요 위축 */
      d=Math.min(d,dealerStock[md.id]+8000); /* 재고 바닥이면 판매 제약 */
      rec.retail[md.id]=Math.round(d);
      retailHist[md.id].push(rec.retail[md.id]);
    });

    /* 주문 산출 (재고 목표 수렴 컨트롤러) */
    MODELS.forEach(md=>{
      const h=retailHist[md.id], n=h.length;
      const f=(n>=4?(h[n-2]+h[n-3]+h[n-4]):(h[n-1]*3))/3; /* 직전 3개월 예측 */
      const target=f*(DS_TARGET/30);
      const ord=Math.max(0,f+(target-dealerStock[md.id])/2);
      rec.orders[md.id]=Math.round(ord);
    });

    /* 생산 (공장 케파·가용률) */
    PLANT_IDS.forEach(p=>rec.prodByPlant[p]=0);
    MODELS.forEach(md=>{
      const p=md.plant;
      let avail=1;
      if(p==="KR-UL"&&i===EVT_KRUL[0])avail=.80;
      if(p==="KR-UL"&&i===EVT_KRUL[1])avail=.90;
      const capLeft=PLANTS[p].cap*avail-rec.prodByPlant[p];
      const want=rec.orders[md.id]+backlog[md.id];
      const made=Math.max(0,Math.min(want,capLeft));
      backlog[md.id]=Math.max(0,want-made);
      rec.prod[md.id]=Math.round(made);
      rec.prodByPlant[p]+=rec.prod[md.id];
      prodHist[md.id].push(rec.prod[md.id]);
    });

    /* 운송 도착(리드타임 가중) & 파이프라인 */
    rec.inTransit={"선박":0,"철도":0,"트럭":0};
    rec.plantStock={};
    MODELS.forEach(md=>{
      const w=PLANTS[md.plant].shipW,h=prodHist[md.id];
      let arr=0,transit=0;
      for(let j=0;j<w.length;j++){
        const pv=h[h.length-1-j]||0;
        arr+=w[j]*pv;
        let rest=0;for(let k=j+1;k<w.length;k++)rest+=w[k];
        transit+=rest*pv;
      }
      rec.arriv[md.id]=Math.round(arr);
      const mm=PLANTS[md.plant].mainMode;
      rec.inTransit[mm]+=Math.round(transit*.85);
      rec.inTransit[PLANTS[md.plant].modes[1]||mm]+=Math.round(transit*.15);
    });
    PLANT_IDS.forEach(p=>{rec.plantStock[p]=Math.round(rec.prodByPlant[p]*.35*noise(.15))});

    /* 재고/도매/판매 반영 */
    rec.wholesale={};rec.wholesaleTotal=0;rec.dealerStock={};
    MODELS.forEach(md=>{
      rec.wholesale[md.id]=rec.arriv[md.id];
      dealerStock[md.id]=Math.max(0,dealerStock[md.id]+rec.arriv[md.id]-rec.retail[md.id]);
      rec.dealerStock[md.id]=Math.round(dealerStock[md.id]);
      rec.retailTotal+=rec.retail[md.id];rec.ordersTotal+=rec.orders[md.id];rec.wholesaleTotal+=rec.wholesale[md.id];
    });
    rec.dealerStockTotal=Object.values(rec.dealerStock).reduce((a,b)=>a+b,0);
    rec.ds=Math.round(rec.dealerStockTotal/(rec.retailTotal/30));

    /* 지역 분배 */
    rec.regions={};
    REGIONS.forEach((rg,ri)=>{
      const wob=rg.w*noise(.06);
      const rr=Math.round(rec.retailTotal*wob), st=Math.round(rec.dealerStockTotal*rg.w*noise(.10));
      let svc=.62+rnd()*.1; /* 서비스 베이 가동률 */
      if(i>=EVT_CAMP_START&&i<EVT_CAMP_START+4) svc=Math.min(1.08,svc+.28+(ri%3)*.04);
      rec.regions[rg.id]={retail:rr,stock:st,ds:Math.round(st/(rr/30)),svc:+svc.toFixed(2)};
    });

    /* KPI */
    uio+=rec.retailTotal;
    rec.uio=Math.round(uio);
    let csi=87+(rnd()-0.5);
    if(i>=EVT_CAMP_START&&i<EVT_CAMP_START+CAMP_CSI.length)csi+=CAMP_CSI[i-EVT_CAMP_START];
    rec.csi=+csi.toFixed(1);
    let quality=8+(i>=EVT_CAMP_START&&i<EVT_CAMP_START+3?18:0);
    let freight=0;MODELS.forEach(md=>freight+=rec.prod[md.id]*FREIGHT[md.plant]);
    rec.profitM=+((rec.wholesaleTotal*MARGIN-rec.retailTotal*INCENTIVE-freight)/1e6-quality-9).toFixed(1);
    rec.voc=Math.round(5500*noise(.08)*(i>=EVT_CAMP_START&&i<EVT_CAMP_START+3?1.9:1));
    rec.telem=Math.round(rec.uio*.022);
    rec.mkt=Math.round(1150*noise(.05));

    /* BP */
    rec.bpRetail=Math.round(BP_YEAR[mo.y]/12*season/ (SEASON.reduce((a,b)=>a+b,0)/12));
    rec.bpProfit=+ (rec.bpRetail*1.15/1000).toFixed(1);
    rec.bpDs=DS_TARGET;

    /* 알림 */
    if(i===EVT_KRUL[0]||i===EVT_KRUL[1])rec.alerts.push({sev:"warn",obj:"KR-UL",txt:"KR-UL 설비 이상 — 생산 "+(i===EVT_KRUL[0]?"−20%":"−10%")});
    if(i>=EVT_CAMP_START&&i<EVT_CAMP_START+4)rec.alerts.push({sev:"crit",obj:"svc",txt:"Aurora 품질 캠페인 진행 — 서비스 부하 상승"});
    if(rec.ds>80)rec.alerts.push({sev:"warn",obj:"dealer",txt:"딜러 재고 과다 — Days Supply "+rec.ds+"일"});
    if(rec.ds<40)rec.alerts.push({sev:"serious",obj:"dealer",txt:"딜러 재고 부족 — Days Supply "+rec.ds+"일"});
    if(mo.sim)rec.alerts.push({sev:"good",obj:"sim",txt:"시뮬레이션 구간 — 최근 3개월 윈도우 기반 생성"});
    byMonth.push(rec);
  }
  return {byMonth};
}

/* ---- VIN 합성 (결정적) ---- */
const VIN_CH="ABCDEFGHJKLMNPRSTUVWXYZ0123456789";
function synthVins(ctx,count){ /* ctx: {plant,model,trim,ym,region} */
  const md=MODELS.find(m=>m.id===ctx.model)||MODELS[0];
  const plant=ctx.plant||md.plant;
  const seed=hashStr(plant+"|"+ctx.model+"|"+(ctx.trim||"")+"|"+ctx.ym+"|"+(ctx.region||""));
  const r=mulberry32(seed);
  const out=[];
  for(let i=0;i<count;i++){
    const wmi=PLANTS[plant].wmi;
    let vds="";for(let k=0;k<5;k++)vds+=VIN_CH[Math.floor(r()*VIN_CH.length)];
    const chk=VIN_CH[Math.floor(r()*11)];
    const yr={2024:"R",2025:"S",2026:"T",2027:"V"}[+ctx.ym.slice(0,4)]||"T";
    const pc=plant==="US-AL"?"A":plant==="KR-UL"?"U":"M";
    let ser="";for(let k=0;k<6;k++)ser+=Math.floor(r()*10);
    const trim=ctx.trim||md.trims[Math.floor(r()*md.trims.length)];
    const region=ctx.region||REGIONS[Math.floor(r()*REGIONS.length)].id;
    out.push({vin:wmi+vds+chk+yr+pc+ser,model:md.id,trim,plant,region,ym:ctx.ym,seed:Math.floor(r()*1e9)});
  }
  return out;
}
function vinChain(v){ /* 판매월 기준 역산 체인 — 날짜 단조 증가 */
  const r=mulberry32(v.seed||hashStr(v.vin));
  const g=(base,amp)=>Math.max(1,Math.round(base+(r()*2-1)*amp));
  const overseas=v.plant!=="US-AL";
  const ship=v.plant==="KR-UL";
  const steps=[];
  steps.push({st:"ORDERED",loc:"판매법인 A · 월 주문",gap:0});
  steps.push({st:"IN_PRODUCTION",loc:PLANTS[v.plant].name+" 라인",gap:g(18,6)});
  steps.push({st:"PLANT_STOCK",loc:PLANTS[v.plant].loc+" 야드",gap:g(3,1)});
  steps.push({st:"IN_TRANSIT",loc:ship?"선박 (태평양)":"철도/트럭",gap:g(5,3)});
  if(overseas)steps.push({st:"PORT_YARD",loc:ship?"LA/Long Beach 항만":"Laredo 통관 야드",gap:ship?g(24,4):g(9,3)});
  steps.push({st:"DEALER_ARRIVAL (=WHOLESALE)",loc:v.region+" 리전 딜러",gap:overseas?g(6,2):g(4,2)});
  steps.push({st:"DEALER_STOCK",loc:v.region+" 딜러 재고",gap:1});
  steps.push({st:"RETAIL_SALE",loc:v.region+" 딜러 · 고객 인도",gap:g(24,14)});
  steps.push({st:"IN_SERVICE",loc:"커넥티드 개통 · 텔레매틱스 수집",gap:0});
  const hasSvc=r()<.42||(v.model==="Aurora"&&v.ym>="2026-03");
  if(hasSvc)steps.push({st:"SERVICE_EVENT",loc:v.region+" 딜러 서비스 — "+(v.model==="Aurora"&&v.ym>="2026-03"?"캠페인":r()<.5?"워런티":"고객 페이"),gap:g(85,50)});
  /* 날짜 부여: RETAIL_SALE이 v.ym 중순에 오도록 앵커 */
  let total=0;const idxRetail=steps.findIndex(s=>s.st==="RETAIL_SALE");
  for(let i=1;i<=idxRetail;i++)total+=steps[i].gap;
  const anchor=new Date(+v.ym.slice(0,4),+v.ym.slice(5,7)-1,12);
  let t=new Date(anchor.getTime()-total*86400000);
  const out=[];
  steps.forEach((s,i)=>{if(i>0)t=new Date(t.getTime()+s.gap*86400000);out.push({st:s.st,loc:s.loc,date:t.toISOString().slice(0,10),gap:i>0?s.gap:0})});
  return out;
}

/* ---- 파티클 엔진 ---- */
const Flows={list:[],raf:null,last:0,CAP:120,
  reset(){this.list=[];},
  add(pathEl,kind,rate){ /* rate 0..1 */
    if(!pathEl.getTotalLength)return;
    const len=pathEl.getTotalLength();
    const maxN=kind==="data"?10:14;
    this.list.push({pathEl,len,kind,rate:Math.max(0,Math.min(1,rate)),parts:[],maxN});
  },
  layer:null,
  ensureLayer(svg){this.layer=el("g",{class:"flow-layer"},svg)},
  step(ts){
    if(!Flows.raf)return;
    const dt=Math.min(50,ts-Flows.last||16);Flows.last=ts;
    let total=0;Flows.list.forEach(f=>total+=f.parts.length);
    Flows.list.forEach(f=>{
      const want=Math.round(f.rate*f.maxN);
      if(f.parts.length<want&&total<Flows.CAP&&Math.random()<.15){
        const sz=f.kind==="data"?2.1:f.kind==="cmd"?2.6:3.4;
        const cls=f.kind==="data"?"p-data":f.kind==="cmd"?"p-cmd":"p-mat";
        const c=el("circle",{r:sz,class:cls,opacity:.9},Flows.layer);
        f.parts.push({el:c,t:Math.random()*.08});total++;
      }
      const speed=(f.kind==="data"?.00023:.00013)*(0.6+f.rate*.8);
      for(let i=f.parts.length-1;i>=0;i--){
        const p=f.parts[i];p.t+=speed*dt;
        if(p.t>1){ if(f.parts.length>Math.round(f.rate*f.maxN)){p.el.remove();f.parts.splice(i,1);continue} p.t=0;}
        const pt=f.pathEl.getPointAtLength(p.t*f.len);
        p.el.setAttribute("cx",pt.x);p.el.setAttribute("cy",pt.y);
      }
    });
    Flows.raf=requestAnimationFrame(Flows.step);
  },
  start(){if(REDUCED||this.raf)return;this.last=performance.now();this.raf=requestAnimationFrame(this.step)},
  stop(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=null}}
};
document.addEventListener("visibilitychange",()=>{document.hidden?Flows.stop():Flows.start()});

/* ---- 숫자 티킹 ---- */
function tickNum(node,to,fmtFn){
  fmtFn=fmtFn||fmt;
  const from=+(node.dataset.v||to);node.dataset.v=to;
  if(REDUCED||from===to){node.textContent=fmtFn(to);return}
  const t0=performance.now(),dur=380;
  function fr(t){const k=Math.min(1,(t-t0)/dur);node.textContent=fmtFn(from+(to-from)*k);if(k<1)requestAnimationFrame(fr)}
  requestAnimationFrame(fr);
}

/* ---- 툴팁 ---- */
const tipEl=$("tooltip");
function tipShow(evt,title,rows){ /* rows: [[label,value,color?]] */
  tipEl.textContent="";
  const t=document.createElement("div");t.className="tt-title";t.textContent=title;tipEl.appendChild(t);
  (rows||[]).forEach(r=>{
    const d=document.createElement("div");d.className="tt-row";
    if(r[2]){const k=document.createElement("span");k.className="tt-key";k.style.borderTopColor=r[2];d.appendChild(k)}
    const l=document.createElement("span");l.textContent=r[0];d.appendChild(l);
    const b=document.createElement("b");b.textContent=r[1];d.appendChild(b);
    tipEl.appendChild(d);
  });
  tipEl.style.display="block";tipMove(evt);
}
function tipMove(evt){
  const pad=14,w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let x=evt.clientX+pad,y=evt.clientY+pad;
  if(x+w>innerWidth-8)x=evt.clientX-w-pad;
  if(y+h>innerHeight-8)y=evt.clientY-h-pad;
  tipEl.style.left=x+"px";tipEl.style.top=y+"px";
}
function tipHide(){tipEl.style.display="none"}
function bindTip(node,build){
  node.addEventListener("pointerenter",e=>{const a=build();tipShow(e,a[0],a[1])});
  node.addEventListener("pointermove",tipMove);
  node.addEventListener("pointerleave",tipHide);
}

function objBox(g,x,y,w,h,click){

function lamp(g,x,y,sev,label){ /* sev: good|warn|serious|crit */
  const sym={good:"●",warn:"▲",serious:"◆",crit:"■"}[sev]||"●";
  const col={good:"var(--good)",warn:"var(--warn)",serious:"var(--serious)",crit:"var(--crit)"}[sev];
  const t=el("text",{x,y,class:"lamp-lbl"},g);
  const s1=el("tspan",{fill:col,text:sym+" "},t);

function gauge(g,x,y,w,ratio,color){
  el("rect",{x,y,width:w,height:6,rx:3,class:"gauge-track"},g);
  const r=Math.max(0,Math.min(1,ratio));
  if(r>0)el("rect",{x,y,width:Math.max(3,w*r),height:6,rx:3,fill:color||"var(--s1)"},g);
}
function flowPath(g,d,kind,rate,badgeTxt,tipBuild){
  const width=kind==="data"?1.4:kind==="cmd"?2.2:Math.max(2.5,2.5+rate*5);
  const p=el("path",{d,class:kind==="data"?"flow-data":"flow-mat","stroke-width":width},g);
  Flows.add(p,kind,rate);
  if(badgeTxt){
    const len=p.getTotalLength(),pt=p.getPointAtLength(len*.52);
    let bw=16;for(const ch of badgeTxt)bw+=ch.charCodeAt(0)>0x2500?9.6:5.6;
    const bg=el("g",{},g);
    el("rect",{x:pt.x-bw/2,y:pt.y-9,width:bw,height:16,rx:8,class:"badge-bg"},bg);
    el("text",{x:pt.x,y:pt.y+3,"text-anchor":"middle",class:"badge-txt",text:badgeTxt},bg);
    if(tipBuild)bindTip(bg,tipBuild);
  }
  if(tipBuild){p.style.pointerEvents="stroke";bindTip(p,tipBuild)}
  return p;
}

/* ===== 패널 콘텐츠 ===== */
function miniChart(parent,series,opts){ /* series:[{name,vals,color,dash}] */
  const W=336,H=140,PL=38,PR=8,PT=10,PB=22;
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.style.width="100%";parent.appendChild(svg);
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null));
  const max=Math.max(...all)*1.08,min=0;
  const n=series[0].vals.length;
  const X=i=>PL+(W-PL-PR)*i/(n-1), Y=v=>PT+(H-PT-PB)*(1-(v-min)/(max-min));
  for(let t=0;t<=2;t++){const v=min+(max-min)*t/2,y=Y(v);
    el("line",{x1:PL,y1:y,x2:W-PR,y2:y,stroke:"var(--grid)","stroke-width":1},svg);
    el("text",{x:PL-4,y:y+3,"text-anchor":"end","font-size":"8.5px",fill:"var(--muted)",text:fmtK(v)},svg);}
  /* 실적/시뮬 경계 */
  const bx=X(NOW_IDX/47*(n-1));
  el("line",{x1:bx,y1:PT,x2:bx,y2:H-PB,stroke:"var(--baseline)","stroke-width":1,"stroke-dasharray":"2 3"},svg);
  series.forEach(s=>{
    let d="";s.vals.forEach((v,i)=>{d+=(i?" L":"M")+" "+X(i)+" "+Y(v)});
    el("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-dasharray":s.dash?"4 4":"none"},svg);
  });
  const mk=el("line",{x1:X(S.mi/47*(n-1)),y1:PT,x2:X(S.mi/47*(n-1)),y2:H-PB,stroke:"var(--s2)","stroke-width":1},svg);
  el("text",{x:PL,y:H-6,"font-size":"8.5px",fill:"var(--muted)",text:"2024-01"},svg);
  el("text",{x:W-PR,y:H-6,"text-anchor":"end","font-size":"8.5px",fill:"var(--muted)",text:"2027-12"},svg);
  /* 범례 */
  const lg=document.createElement("div");lg.style.cssText="display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:2px";
  series.forEach(s=>{const it=document.createElement("span");
    const k=document.createElement("span");k.className="tt-key";k.style.borderTopColor=s.color;if(s.dash)k.style.borderTopStyle="dashed";
    it.appendChild(k);it.appendChild(document.createTextNode(" "+s.name));lg.appendChild(it)});
  parent.appendChild(lg);
  /* 호버 툴팁 */
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect();
    const i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*W>PL?((e.clientX-r.left)/r.width*W-PL)/(W-PL-PR)*(n-1):0)));
    const mi2=Math.round(i/(n-1)*47);
    tipShow(e,MONTHS[mi2].ym+(MONTHS[mi2].sim?" (시뮬레이션)":""),series.map(s=>[s.name,fmt(s.vals[i]),s.color]));
  });
  svg.addEventListener("pointerleave",tipHide);
}
function vinSection(body,ctx,title){
  const sec=pnlSection(body,title||"VIN 드릴다운");
  function showChain(v){
    sec.textContent="";
    const h2=document.createElement("h3");h2.textContent="이벤트 체인 — "+v.vin;sec.appendChild(h2);
    const back=document.createElement("button");back.className="pnl-btn";back.type="button";back.textContent="← VIN 목록";
    back.style.marginBottom="8px";sec.appendChild(back);
    back.addEventListener("click",showList);
    const wrap=document.createElement("div");wrap.className="vin-chain";sec.appendChild(wrap);
    vinChain(v).forEach(st=>{
      const d=document.createElement("div");d.className="vc-step"+(st.st==="SERVICE_EVENT"?" evt-svc":"");
      const c1=document.createElement("div");
      const s1=document.createElement("div");s1.className="vc-stage";s1.textContent=st.st;
      const s2=document.createElement("div");s2.className="vc-meta";s2.textContent=st.date+" · "+st.loc+(st.gap?" · +"+st.gap+"일":"");
      c1.appendChild(s1);c1.appendChild(s2);d.appendChild(c1);wrap.appendChild(d);
    });
    const note=document.createElement("div");note.className="back-note";
    note.textContent="실데이터에서는 이 체인이 vin_event 원본 조회로 대체됩니다.";sec.appendChild(note);
  }
  function showList(){
    sec.textContent="";
    const h=document.createElement("h3");h.textContent="VIN 샘플 — "+cur().ym+" (집계 → VIN)";sec.appendChild(h);
    const tb=document.createElement("table");tb.className="pnl-table";
    const hd=tb.insertRow();["VIN","모델","트림","리전"].forEach(c=>{const th=document.createElement("th");th.textContent=c;hd.appendChild(th)});
    synthVins({...ctx,ym:cur().ym},10).forEach(v=>{
      const tr=tb.insertRow();tr.className="rowlink";
      [v.vin,v.model,v.trim,v.region].forEach(c=>{const td=tr.insertCell();td.textContent=c});
      tr.addEventListener("click",()=>showChain(v));
    });
    sec.appendChild(tb);
  }
  const btn=document.createElement("button");btn.className="pnl-btn";btn.type="button";btn.textContent="VIN 샘플 보기";
  sec.appendChild(btn);
  btn.addEventListener("click",showList);
}
function plantPanel(pid){
  const p=PLANTS[pid];
  const body=openPanel(p.name+" — 상세");
  const s1=pnlSection(body,"월 생산 vs BP (48개월)");
  const prodVals=DATA.byMonth.map(r=>r.prodByPlant[pid]);
  const share=MODELS.filter(m=>m.plant===pid).reduce((a,m)=>a+m.share,0);
  const bpVals=DATA.byMonth.map(r=>Math.round(r.bpRetail*share*1.08));
  miniChart(s1,[{name:"생산 실적/시뮬",vals:prodVals,color:"var(--s1)"},{name:"BP",vals:bpVals,color:"var(--muted)",dash:true}]);
  const s2=pnlSection(body,"당월 생산 구성 — "+cur().ym);
  const tb=document.createElement("table");tb.className="pnl-table";
  const hd=tb.insertRow();["모델","생산","주문","공장 재고 추정"].forEach(c=>{const th=document.createElement("th");th.textContent=c;hd.appendChild(th)});
  MODELS.filter(m=>m.plant===pid).forEach(md=>{
    const r=cur();const tr=tb.insertRow();
    const c0=tr.insertCell();const sw=document.createElement("span");sw.className="swatch";sw.style.background=`var(--s${md.slot})`;c0.appendChild(sw);c0.appendChild(document.createTextNode(md.id));
    [fmt(r.prod[md.id]),fmt(r.orders[md.id]),fmt(Math.round(r.plantStock[pid]*md.share/share))].forEach(v=>{const td=tr.insertCell();td.className="num";td.textContent=v});
  });
  s2.appendChild(tb);
  vinSection(body,{plant:pid,model:MODELS.find(m=>m.plant===pid).id});
}
function regionPanel(rid){
  const body=openPanel(rid+" 리전 — 상세");
  const d=cur().regions[rid];
  const s1=pnlSection(body,"현황 — "+cur().ym);
  const tb=document.createElement("table");tb.className="pnl-table";
  [["Retail",fmt(d.retail)+"대"],["딜러 재고",fmt(d.stock)+"대"],["Days Supply",d.ds+"일 (목표 60일)"],["서비스 베이 가동률",Math.round(d.svc*100)+"%"+(d.svc>1?" — 과부하":"")]].forEach(row=>{
    const tr=tb.insertRow();const td0=tr.insertCell();td0.textContent=row[0];const td1=tr.insertCell();td1.className="num";td1.textContent=row[1];
  });
  s1.appendChild(tb);
  const s2=pnlSection(body,"모델별 재고 (추정 배분)");
  const tb2=document.createElement("table");tb2.className="pnl-table";
  MODELS.forEach(md=>{
    const tr=tb2.insertRow();
    const c0=tr.insertCell();const sw=document.createElement("span");sw.className="swatch";sw.style.background=`var(--s${md.slot})`;c0.appendChild(sw);c0.appendChild(document.createTextNode(md.id));
    const c1=tr.insertCell();c1.className="num";c1.textContent=fmt(Math.round(d.stock*md.share));
  });
  s2.appendChild(tb2);
  const s3=pnlSection(body,"VoC 상위 카테고리");
  const cats=cur().idx>=EVT_CAMP_START&&cur().idx<EVT_CAMP_START+3
    ?[["전장/배터리",42],["소음/진동",14],["인포테인먼트",12],["도장/외관",9],["공조",6]]
    :[["소음/진동",18],["인포테인먼트",15],["전장/배터리",12],["도장/외관",10],["공조",8]];
  const tb3=document.createElement("table");tb3.className="pnl-table";
  cats.forEach(c=>{const tr=tb3.insertRow();const a=tr.insertCell();a.textContent=c[0];const b=tr.insertCell();b.className="num";b.textContent=c[1]+"%"});
  s3.appendChild(tb3);
  vinSection(body,{region:rid,model:"Meridian"});
}

/* ===== KPI · 알림 · 타임라인 ===== */
const KPIS=[
 {lbl:"Retail 판매",get:r=>r.retailTotal,ref:r=>r.bpRetail,fmt:fmtK,goodUp:true,unit:"대"},
 {lbl:"Wholesale",get:r=>r.wholesaleTotal,ref:r=>Math.round(r.bpRetail*1.05),fmt:fmtK,goodUp:true,unit:"대"},
 {lbl:"영업이익",get:r=>r.profitM,ref:r=>r.bpProfit,fmt:v=>"$"+v.toFixed(1)+"M",goodUp:true,unit:""},
 {lbl:"고객만족도 (CSI)",get:r=>r.csi,ref:()=>87,fmt:v=>v.toFixed(1),goodUp:true,unit:""},
 {lbl:"Days Supply",get:r=>r.ds,ref:()=>DS_TARGET,fmt:v=>Math.round(v)+"일",goodUp:null,unit:""},
];
function renderKpis(){
  const row=$("kpiRow");row.textContent="";
  const r=cur();
  KPIS.forEach(k=>{
    const v=k.get(r),ref=k.ref(r);
    const d=document.createElement("div");d.className="kpi";
    const l=document.createElement("div");l.className="lbl";l.textContent=k.lbl;d.appendChild(l);
    const rw=document.createElement("div");rw.className="row";
    const val=document.createElement("span");val.className="val";val.textContent=k.fmt(v)+(k.unit&&typeof v==="number"?"":"");rw.appendChild(val);
    const del=document.createElement("span");
    const diff=v-ref, pct=ref?diff/ref*100:0;
    let good; if(k.goodUp===null)good=Math.abs(diff)<=10; else good=k.goodUp?diff>=0:diff<=0;
    del.className="delta "+(good?"good":"bad");
    del.textContent=(k.goodUp===null?"목표 60일 대비 ":"BP 대비 ")+(diff>=0?"+":"")+(k.lbl==="Days Supply"||k.lbl.startsWith("고객")?diff.toFixed(0):pct.toFixed(1)+"%");
    rw.appendChild(del);d.appendChild(rw);
    /* 스파크라인 */
    const vals=[];for(let i=Math.max(0,S.mi-11);i<=S.mi;i++)vals.push(k.get(DATA.byMonth[i]));
    const sp=document.createElementNS(svgNS,"svg");sp.setAttribute("viewBox","0 0 96 20");sp.setAttribute("width","96");sp.setAttribute("height","20");
    const mn=Math.min(...vals),mx=Math.max(...vals);
    let pd="";vals.forEach((vv,i)=>{const x=2+92*i/(vals.length-1),y=17-14*((vv-mn)/((mx-mn)||1));pd+=(i?" L":"M")+x+" "+y});
    el("path",{d:pd,fill:"none",stroke:"var(--muted)","stroke-width":1.5},sp);
    const lx=94,ly=17-14*((vals[vals.length-1]-mn)/((mx-mn)||1));
    el("circle",{cx:lx-2,cy:ly,r:2.4,fill:"var(--s1)"},sp);
    d.appendChild(sp);
    row.appendChild(d);
  });
}
function renderAlerts(){
  const s=$("alertStrip");s.textContent="";
  cur().alerts.forEach(a=>{
    const c=document.createElement("span");c.className="alert-chip "+a.sev;
    const ic=document.createElement("span");ic.className="ic";
    ic.textContent={good:"●",warn:"▲",serious:"◆",crit:"■"}[a.sev];
    const lb=document.createElement("b");lb.textContent={good:"정보",warn:"주의",serious:"경고",crit:"심각"}[a.sev];
    c.appendChild(ic);c.appendChild(lb);c.appendChild(document.createTextNode(" "+a.txt));
    s.appendChild(c);
  });
}
function setMonth(mi){
  S.mi=Math.max(0,Math.min(47,mi));
  $("tlSlider").value=S.mi;
  const mo=MONTHS[S.mi];
  $("tlCur").textContent="";
  const t=document.createElement("span");t.textContent=mo.ym;$("tlCur").appendChild(t);
  const tag=document.createElement("span");tag.className="tag"+(mo.sim?" sim":"");
  tag.textContent=mo.sim?"시뮬레이션":(S.mi===NOW_IDX?"현재":"실적");$("tlCur").appendChild(tag);
  $("modeBadge").textContent=mo.sim?"시뮬레이션":"실적";
  $("modeBadge").className="mode-badge"+(mo.sim?" sim":"");
  renderKpis();renderAlerts();updScene();
}
function play(on){
  S.playing=on;
  $("tlPlay").textContent=on?"❚❚":"▶";
  $("tlPlay").setAttribute("aria-label",on?"일시정지":"재생");
  if(S.timer){clearInterval(S.timer);S.timer=null}
  if(on)S.timer=setInterval(()=>{if(S.mi>=47){play(false);return}setMonth(S.mi+1)},900/S.speed);
}
$("tlPlay").addEventListener("click",()=>play(!S.playing));
$("tlSpeed").addEventListener("click",()=>{S.speed=S.speed===1?2:S.speed===2?4:1;$("tlSpeed").textContent=S.speed+"×";if(S.playing)play(true)});
$("tlSlider").addEventListener("input",e=>{play(false);setMonth(+e.target.value)});
(function(){const track=$("tlTrack");const pct=((NOW_IDX+0.5)/47)*100;$("tlBoundary").style.left=pct+"%"})();

/* 테마 토글 */
$("themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark=root.getAttribute("data-theme")==="dark";
  root.setAttribute("data-theme",dark?"light":"dark");
  $("themeBtn").textContent=dark?"다크 모드":"라이트 모드";
});

/* ===== 부트 ===== */
renderCrumbs();
renderScene();
setMonth(NOW_IDX);

</script>
